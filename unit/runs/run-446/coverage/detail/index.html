<!doctype html>
<html lang="en">

<head>
  <!-- Import style -->
  <link rel="stylesheet" href="index.css" />
  <!-- Import Vue 3 -->
  <script src="vue.global.prod.js"></script>
  <!-- Import component library -->
  <script src="index.full.min.js"></script>
  <meta charset="UTF-8">
  <title>Coverage</title>
</head>

<body>
  <div id="app" class="common-layout">
    <el-container>
      <el-header>
        <el-row>
          <span>All Files Coverage</span>
          <el-divider />
        </el-row>
      </el-header>
      <el-main>
        <el-row>
          <el-col :span="8">
            <div class="statistic-card">
              <el-statistic :precision="2" :value="tableData.summary.functions.pct">
                <template #title>
                  <div style="display: inline-flex; align-items: center">
                    Functions
                  </div>
                </template>
                <template #suffix>%</template>
              </el-statistic>
              <div class="statistic-footer">
                <div class="footer-item">
                  <span>{{tableData.summary.functions.covered}}/{{tableData.summary.functions.total}}</span>
                </div>
              </div>
            </div>
          </el-col>

          <el-col :span="8">
            <div class="statistic-card">
              <el-statistic :precision="2" :value="tableData.summary.branches.pct">
                <template #title>
                  <div style="display: inline-flex; align-items: center">
                    Branches
                  </div>
                </template>
                <template #suffix>%</template>
              </el-statistic>
              <div class="statistic-footer">
                <div class="footer-item">
                  <span>{{tableData.summary.branches.covered}}/{{tableData.summary.branches.total}}</span>
                </div>
              </div>
            </div>
          </el-col>

          <el-col :span="8">
            <div class="statistic-card">
              <el-statistic :precision="2" :value="tableData.summary.lines.pct">
                <template #title>
                  <div style="display: inline-flex; align-items: center">
                    Lines
                  </div>
                </template>
                <template #suffix>%</template>
              </el-statistic>
              <div class="statistic-footer">
                <div class="footer-item">
                  <span>{{tableData.summary.lines.covered}}/{{tableData.summary.lines.total}}</span>
                </div>
              </div>
            </div>
          </el-col>
        </el-row>
        <el-row>
          <el-divider />
        </el-row>

        <el-table :data="tableData.files" :default-sort="{ prop: 'file', order: 'ascending' }" :row-class-name="tableRowClassName" border
          style="width: 100%">
          <el-table-column sortable prop="path" label="File" width="600">
            <template #default="scope"> <el-link type="primary"
                :href="scope.row.link">{{scope.row.path}}</el-link></template>
          </el-table-column>
          <el-table-column sortable prop="summary.functions.pct" label="Functions"></el-table-column>
          <el-table-column prop="summary.functions.total,summary.functions.covered" label="">
            <template #default="scope">{{scope.row.summary.functions.covered}}/{{scope.row.summary.functions.total}}</template>
          </el-table-column>
          <el-table-column sortable prop="summary.branches.pct" label="Branches"></el-table-column>
          <el-table-column prop="summary.branches.total,summary.branches.covered" label="">
            <template #default="scope">{{scope.row.summary.branches.covered}}/{{scope.row.summary.branches.total}}</template>
          </el-table-column>
          <el-table-column sortable prop="summary.lines.pct" label="Lines"></el-table-column>
          <el-table-column prop="summary.lines.total,summary.lines.covered" label="">
            <template #default="scope">{{scope.row.summary.lines.covered}}/{{scope.row.summary.lines.total}}</template>
          </el-table-column>
        </el-table>
      </el-main>
      <el-footer align="middle" class="footer">
        Code coverage generated by <el-link href="https://github.com/SMAT-Lab/bjc" type="primary" target="_blank">bjc</el-link> at {{tableData.date}}
      </el-footer>
    </el-container>
  </div>
</body>

<script>
  const App = {
    data() {
      return {
        tableData: {"date":"Mon Aug 24 2026 22:26:30 GMT+0800 (China Standard Time)","files":[{"version":"bjc v1.0.0","versionCode":10000,"path":"entrybackupability","link":"./entrybackupability/index.html","hash":"","lineCnt":0,"count":0,"projectPath":"","functions":[],"summary":{"lines":{"total":6,"covered":0,"pct":0},"functions":{"total":2,"covered":0,"pct":0},"branches":{"total":0,"covered":0,"pct":100}},"exeLine":[]},{"version":"bjc v1.0.0","versionCode":10000,"path":"entryability","link":"./entryability/index.html","hash":"","lineCnt":0,"count":0,"projectPath":"","functions":[],"summary":{"lines":{"total":98,"covered":0,"pct":0},"functions":{"total":20,"covered":0,"pct":0},"branches":{"total":14,"covered":0,"pct":0}},"exeLine":[]},{"version":"bjc v1.0.0","versionCode":10000,"path":"utils","link":"./utils/index.html","hash":"","lineCnt":0,"count":0,"projectPath":"","functions":[],"summary":{"lines":{"total":1947,"covered":486,"pct":24.96},"functions":{"total":170,"covered":47,"pct":27.65},"branches":{"total":571,"covered":88,"pct":15.41}},"exeLine":[]},{"version":"bjc v1.0.0","versionCode":10000,"path":"db","link":"./db/index.html","hash":"","lineCnt":0,"count":0,"projectPath":"","functions":[],"summary":{"lines":{"total":3151,"covered":305,"pct":9.679},"functions":{"total":306,"covered":44,"pct":14.38},"branches":{"total":581,"covered":26,"pct":4.475}},"exeLine":[]},{"version":"bjc v1.0.0","versionCode":10000,"path":"services","link":"./services/index.html","hash":"","lineCnt":0,"count":0,"projectPath":"","functions":[],"summary":{"lines":{"total":2708,"covered":1167,"pct":43.09},"functions":{"total":294,"covered":124,"pct":42.18},"branches":{"total":692,"covered":275,"pct":39.74}},"exeLine":[]},{"version":"bjc v1.0.0","versionCode":10000,"path":"stores","link":"./stores/index.html","hash":"","lineCnt":0,"count":0,"projectPath":"","functions":[],"summary":{"lines":{"total":206,"covered":43,"pct":20.87},"functions":{"total":36,"covered":8,"pct":22.22},"branches":{"total":46,"covered":14,"pct":30.43}},"exeLine":[]},{"version":"bjc v1.0.0","versionCode":10000,"path":"pages","link":"./pages/index.html","hash":"","lineCnt":0,"count":0,"projectPath":"","functions":[],"summary":{"lines":{"total":1199,"covered":574,"pct":47.87},"functions":{"total":167,"covered":46,"pct":27.54},"branches":{"total":318,"covered":129,"pct":40.57}},"exeLine":[]},{"version":"bjc v1.0.0","versionCode":10000,"path":"components","link":"./components/index.html","hash":"","lineCnt":0,"count":0,"projectPath":"","functions":[],"summary":{"lines":{"total":7804,"covered":2241,"pct":28.72},"functions":{"total":1328,"covered":254,"pct":19.13},"branches":{"total":2304,"covered":522,"pct":22.66}},"exeLine":[]},{"version":"bjc v1.0.0","versionCode":10000,"path":"lib","link":"./lib/index.html","hash":"","lineCnt":0,"count":0,"projectPath":"","functions":[],"summary":{"lines":{"total":4220,"covered":931,"pct":22.06},"functions":{"total":361,"covered":121,"pct":33.52},"branches":{"total":1334,"covered":267,"pct":20.01}},"exeLine":[]},{"version":"bjc v1.0.0","versionCode":10000,"path":"subtitle","link":"./subtitle/index.html","hash":"","lineCnt":0,"count":0,"projectPath":"","functions":[],"summary":{"lines":{"total":898,"covered":563,"pct":62.69},"functions":{"total":51,"covered":39,"pct":76.47},"branches":{"total":194,"covered":106,"pct":54.64}},"exeLine":[]},{"version":"bjc v1.0.0","versionCode":10000,"path":"audio","link":"./audio/index.html","hash":"","lineCnt":0,"count":0,"projectPath":"","functions":[],"summary":{"lines":{"total":57,"covered":10,"pct":17.54},"functions":{"total":5,"covered":2,"pct":40},"branches":{"total":10,"covered":1,"pct":10}},"exeLine":[]}],"summary":{"lines":{"total":22294,"covered":6320,"pct":28.35},"functions":{"total":2740,"covered":685,"pct":25},"branches":{"total":6064,"covered":1428,"pct":23.55}}},
        tableRowClassName: ({row, rowIndex}) => {
          if (row.summary.lines.pct > 70) {
            return 'high-row'
          } else if (row.summary.lines.pct > 33) {
            return 'medium-row'
          }
          return 'low-row'
        }
      };
    }
  };

  const app = Vue.createApp(App);
  app.use(ElementPlus);
  app.mount("#app");
</script>

<style scoped>
  .el-statistic {
    --el-statistic-content-font-size: 28px;
  }

  .statistic-card {
    height: 100%;
    padding: 20px;
    border-radius: 4px;
    background-color: var(--el-bg-color-overlay);
  }

  .statistic-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--el-text-color-regular);
    margin-top: 16px;
  }

  .statistic-footer .footer-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .statistic-footer .footer-item span:last-child {
    display: inline-flex;
    align-items: center;
    margin-left: 4px;
  }

  .el-container {
    min-height: 100vh;
    height: 100%;
  }

  .footer {
    font-size: small;
  }

  .el-table .low-row {
    --el-table-tr-bg-color: var(--el-color-error-light-9);
  }

  .el-table .medium-row {
    --el-table-tr-bg-color: var(--el-color-warning-light-9);
  }
  .el-table .high-row {
    --el-table-tr-bg-color: var(--el-color-success-light-9);
  }
</style>

</html>
