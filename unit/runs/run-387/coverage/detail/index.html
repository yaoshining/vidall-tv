<!doctype html>
<html lang="en">

<head>
  <!-- Import style -->
  <link rel="stylesheet" href="index.css" />
  <!-- Import Vue 3 -->
  <script src="vue.global.prod.js"></script>
  <!-- Import component library -->
  <script src="index.full.min.js"></script>
  <meta charset="UTF-8">
  <title>Coverage</title>
</head>

<body>
  <div id="app" class="common-layout">
    <el-container>
      <el-header>
        <el-row>
          <span>All Files Coverage</span>
          <el-divider />
        </el-row>
      </el-header>
      <el-main>
        <el-row>
          <el-col :span="8">
            <div class="statistic-card">
              <el-statistic :precision="2" :value="tableData.summary.functions.pct">
                <template #title>
                  <div style="display: inline-flex; align-items: center">
                    Functions
                  </div>
                </template>
                <template #suffix>%</template>
              </el-statistic>
              <div class="statistic-footer">
                <div class="footer-item">
                  <span>{{tableData.summary.functions.covered}}/{{tableData.summary.functions.total}}</span>
                </div>
              </div>
            </div>
          </el-col>

          <el-col :span="8">
            <div class="statistic-card">
              <el-statistic :precision="2" :value="tableData.summary.branches.pct">
                <template #title>
                  <div style="display: inline-flex; align-items: center">
                    Branches
                  </div>
                </template>
                <template #suffix>%</template>
              </el-statistic>
              <div class="statistic-footer">
                <div class="footer-item">
                  <span>{{tableData.summary.branches.covered}}/{{tableData.summary.branches.total}}</span>
                </div>
              </div>
            </div>
          </el-col>

          <el-col :span="8">
            <div class="statistic-card">
              <el-statistic :precision="2" :value="tableData.summary.lines.pct">
                <template #title>
                  <div style="display: inline-flex; align-items: center">
                    Lines
                  </div>
                </template>
                <template #suffix>%</template>
              </el-statistic>
              <div class="statistic-footer">
                <div class="footer-item">
                  <span>{{tableData.summary.lines.covered}}/{{tableData.summary.lines.total}}</span>
                </div>
              </div>
            </div>
          </el-col>
        </el-row>
        <el-row>
          <el-divider />
        </el-row>

        <el-table :data="tableData.files" :default-sort="{ prop: 'file', order: 'ascending' }" :row-class-name="tableRowClassName" border
          style="width: 100%">
          <el-table-column sortable prop="path" label="File" width="600">
            <template #default="scope"> <el-link type="primary"
                :href="scope.row.link">{{scope.row.path}}</el-link></template>
          </el-table-column>
          <el-table-column sortable prop="summary.functions.pct" label="Functions"></el-table-column>
          <el-table-column prop="summary.functions.total,summary.functions.covered" label="">
            <template #default="scope">{{scope.row.summary.functions.covered}}/{{scope.row.summary.functions.total}}</template>
          </el-table-column>
          <el-table-column sortable prop="summary.branches.pct" label="Branches"></el-table-column>
          <el-table-column prop="summary.branches.total,summary.branches.covered" label="">
            <template #default="scope">{{scope.row.summary.branches.covered}}/{{scope.row.summary.branches.total}}</template>
          </el-table-column>
          <el-table-column sortable prop="summary.lines.pct" label="Lines"></el-table-column>
          <el-table-column prop="summary.lines.total,summary.lines.covered" label="">
            <template #default="scope">{{scope.row.summary.lines.covered}}/{{scope.row.summary.lines.total}}</template>
          </el-table-column>
        </el-table>
      </el-main>
      <el-footer align="middle" class="footer">
        Code coverage generated by <el-link href="https://github.com/SMAT-Lab/bjc" type="primary" target="_blank">bjc</el-link> at {{tableData.date}}
      </el-footer>
    </el-container>
  </div>
</body>

<script>
  const App = {
    data() {
      return {
        tableData: {"date":"Thu Aug 20 2026 17:01:18 GMT+0800 (China Standard Time)","files":[{"version":"bjc v1.0.0","versionCode":10000,"path":"entrybackupability","link":"./entrybackupability/index.html","hash":"","lineCnt":0,"count":0,"projectPath":"","functions":[],"summary":{"lines":{"total":6,"covered":0,"pct":0},"functions":{"total":2,"covered":0,"pct":0},"branches":{"total":0,"covered":0,"pct":100}},"exeLine":[]},{"version":"bjc v1.0.0","versionCode":10000,"path":"entryability","link":"./entryability/index.html","hash":"","lineCnt":0,"count":0,"projectPath":"","functions":[],"summary":{"lines":{"total":88,"covered":0,"pct":0},"functions":{"total":20,"covered":0,"pct":0},"branches":{"total":14,"covered":0,"pct":0}},"exeLine":[]},{"version":"bjc v1.0.0","versionCode":10000,"path":"utils","link":"./utils/index.html","hash":"","lineCnt":0,"count":0,"projectPath":"","functions":[],"summary":{"lines":{"total":1879,"covered":484,"pct":25.76},"functions":{"total":159,"covered":47,"pct":29.56},"branches":{"total":561,"covered":87,"pct":15.51}},"exeLine":[]},{"version":"bjc v1.0.0","versionCode":10000,"path":"db","link":"./db/index.html","hash":"","lineCnt":0,"count":0,"projectPath":"","functions":[],"summary":{"lines":{"total":3129,"covered":305,"pct":9.748},"functions":{"total":301,"covered":44,"pct":14.62},"branches":{"total":579,"covered":26,"pct":4.491}},"exeLine":[]},{"version":"bjc v1.0.0","versionCode":10000,"path":"services","link":"./services/index.html","hash":"","lineCnt":0,"count":0,"projectPath":"","functions":[],"summary":{"lines":{"total":2012,"covered":888,"pct":44.14},"functions":{"total":205,"covered":94,"pct":45.85},"branches":{"total":494,"covered":178,"pct":36.03}},"exeLine":[]},{"version":"bjc v1.0.0","versionCode":10000,"path":"pages","link":"./pages/index.html","hash":"","lineCnt":0,"count":0,"projectPath":"","functions":[],"summary":{"lines":{"total":1072,"covered":561,"pct":52.33},"functions":{"total":153,"covered":45,"pct":29.41},"branches":{"total":274,"covered":126,"pct":45.99}},"exeLine":[]},{"version":"bjc v1.0.0","versionCode":10000,"path":"components","link":"./components/index.html","hash":"","lineCnt":0,"count":0,"projectPath":"","functions":[],"summary":{"lines":{"total":7779,"covered":2231,"pct":28.68},"functions":{"total":1329,"covered":254,"pct":19.11},"branches":{"total":2292,"covered":514,"pct":22.43}},"exeLine":[]},{"version":"bjc v1.0.0","versionCode":10000,"path":"lib","link":"./lib/index.html","hash":"","lineCnt":0,"count":0,"projectPath":"","functions":[],"summary":{"lines":{"total":4160,"covered":875,"pct":21.03},"functions":{"total":357,"covered":117,"pct":32.77},"branches":{"total":1294,"covered":235,"pct":18.16}},"exeLine":[]},{"version":"bjc v1.0.0","versionCode":10000,"path":"subtitle","link":"./subtitle/index.html","hash":"","lineCnt":0,"count":0,"projectPath":"","functions":[],"summary":{"lines":{"total":898,"covered":563,"pct":62.69},"functions":{"total":51,"covered":39,"pct":76.47},"branches":{"total":194,"covered":106,"pct":54.64}},"exeLine":[]},{"version":"bjc v1.0.0","versionCode":10000,"path":"stores","link":"./stores/index.html","hash":"","lineCnt":0,"count":0,"projectPath":"","functions":[],"summary":{"lines":{"total":124,"covered":43,"pct":34.68},"functions":{"total":20,"covered":8,"pct":40},"branches":{"total":30,"covered":14,"pct":46.67}},"exeLine":[]},{"version":"bjc v1.0.0","versionCode":10000,"path":"audio","link":"./audio/index.html","hash":"","lineCnt":0,"count":0,"projectPath":"","functions":[],"summary":{"lines":{"total":57,"covered":10,"pct":17.54},"functions":{"total":5,"covered":2,"pct":40},"branches":{"total":10,"covered":1,"pct":10}},"exeLine":[]}],"summary":{"lines":{"total":21204,"covered":5960,"pct":28.11},"functions":{"total":2602,"covered":650,"pct":24.98},"branches":{"total":5742,"covered":1287,"pct":22.41}}},
        tableRowClassName: ({row, rowIndex}) => {
          if (row.summary.lines.pct > 70) {
            return 'high-row'
          } else if (row.summary.lines.pct > 33) {
            return 'medium-row'
          }
          return 'low-row'
        }
      };
    }
  };

  const app = Vue.createApp(App);
  app.use(ElementPlus);
  app.mount("#app");
</script>

<style scoped>
  .el-statistic {
    --el-statistic-content-font-size: 28px;
  }

  .statistic-card {
    height: 100%;
    padding: 20px;
    border-radius: 4px;
    background-color: var(--el-bg-color-overlay);
  }

  .statistic-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--el-text-color-regular);
    margin-top: 16px;
  }

  .statistic-footer .footer-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .statistic-footer .footer-item span:last-child {
    display: inline-flex;
    align-items: center;
    margin-left: 4px;
  }

  .el-container {
    min-height: 100vh;
    height: 100%;
  }

  .footer {
    font-size: small;
  }

  .el-table .low-row {
    --el-table-tr-bg-color: var(--el-color-error-light-9);
  }

  .el-table .medium-row {
    --el-table-tr-bg-color: var(--el-color-warning-light-9);
  }
  .el-table .high-row {
    --el-table-tr-bg-color: var(--el-color-success-light-9);
  }
</style>

</html>
