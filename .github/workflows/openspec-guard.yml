name: OpenSpec Guard CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openspec-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard openspec tracking
        shell: bash
        run: |
          tracked="$(git ls-files -- openspec)"
          if [ -n "$tracked" ]; then
            echo "$tracked"
            exit 1
          else
            echo "No tracked openspec files detected."
          fi
