name: OpenSpec Guard CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openspec-guard:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard openspec archive tracking
        shell: bash
        run: |
          set -euo pipefail

          tracked_archive="$(git --no-pager ls-files -- openspec/changes/archive)"
          if [ -n "$tracked_archive" ]; then
            echo "::error title=OpenSpec Guard Failed::检测到 openspec/changes/archive 目录下存在被 Git 跟踪的文件。请执行 git rm --cached -r -- openspec/changes/archive，并确认 .gitignore 中存在 /openspec/changes/archive 规则。"
            echo "OpenSpec Guard Failed"
            echo "Tracked archive files:"
            printf "%s\n" "$tracked_archive"
            echo "Fix: git rm --cached -r -- openspec/changes/archive"
            echo "Reminder: .gitignore 中应保留 /openspec/changes/archive 规则"
            exit 1
          fi

          echo "OpenSpec Guard passed: openspec/changes/archive 目录仍为未跟踪状态。"
