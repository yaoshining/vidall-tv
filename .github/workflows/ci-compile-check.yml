name: CI Compile Check

env:
  OHOS_SDK_URL: https://repo.huaweicloud.com/harmonyos/os/5.1.0-Release/ohos-sdk-windows_linux-public.tar.gz
  OHOS_SDK_API_DIR: '12'
  HVIGOR_NPM_REGISTRY: https://repo.harmonyos.com/npm/
  HVIGOR_VERSION: '6.22.3'

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  compile-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Restore OHOS SDK Cache
        id: cache-sdk-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ohos-sdk
          key: ohos-sdk-linux-${{ env.OHOS_SDK_API_DIR }}-v2
          restore-keys: |
            ohos-sdk-linux-${{ env.OHOS_SDK_API_DIR }}-

      - name: Download and Extract OHOS SDK
        if: steps.cache-sdk-restore.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/ohos-sdk"
          cd "${{ runner.temp }}"

          CANDIDATE_URLS=(
            "${OHOS_SDK_URL}"
            "https://repo.huaweicloud.com/harmonyos/os/5.0.3-Release/ohos-sdk-windows_linux-public.tar.gz"
            "https://repo.huaweicloud.com/harmonyos/os/5.0.0-Release/ohos-sdk-windows_linux-public.tar.gz"
          )

          DOWNLOADED=0
          for url in "${CANDIDATE_URLS[@]}"; do
            echo "Try download SDK from: $url"
            if wget -q -O sdk.tar.gz "$url"; then
              DOWNLOADED=1
              echo "Downloaded SDK from: $url"
              break
            fi
          done

          if [[ "$DOWNLOADED" -ne 1 ]]; then
            echo "Failed to download OHOS SDK from all candidate URLs"
            exit 1
          fi

          # 先完整解压，再自动探测 linux 目录，避免不同版本压缩包目录结构差异导致失败。
          tar -xzf sdk.tar.gz -C ohos-sdk/

          LINUX_DIR=$(find ohos-sdk -type d -name "linux" | head -1)
          if [[ -z "$LINUX_DIR" ]]; then
            echo "linux directory not found in SDK archive"
            find ohos-sdk -maxdepth 4 -type d | head -40
            exit 1
          fi
          echo "Detected SDK linux dir: $LINUX_DIR"

          # 统一为固定路径，后续步骤始终使用 ohos-sdk/linux。
          if [[ "$LINUX_DIR" != "ohos-sdk/linux" ]]; then
            rm -rf ohos-sdk/linux || true
            ln -s "$(realpath "$LINUX_DIR")" ohos-sdk/linux
          fi

          # 解压 linux 目录下所有 x64 SDK 组件（不仅是 native），以便拿到 hvigor/toolchains。
          ZIP_LIST=$(find -L ohos-sdk/linux -type f -name "*-linux-*.zip" | tr '\n' ' ')
          if [[ -z "$ZIP_LIST" ]]; then
            ZIP_LIST=$(find -L ohos-sdk/linux -type f -name "*.zip" | tr '\n' ' ')
          fi

          if [[ -z "$ZIP_LIST" ]]; then
            echo "No SDK component zip found under linux directory"
            find -L ohos-sdk/linux -maxdepth 4 -type f | head -80
            exit 1
          fi

          for zip_file in $ZIP_LIST; do
            echo "Extract SDK component: $zip_file"
            unzip -q -o "$zip_file" -d ohos-sdk/linux/
          done

          test -d "ohos-sdk/linux/native"
          test -d "ohos-sdk/linux/toolchains"
          test -d "ohos-sdk/linux/ets"

      - name: Save OHOS SDK Cache
        if: always() && steps.cache-sdk-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ohos-sdk
          key: ohos-sdk-linux-${{ env.OHOS_SDK_API_DIR }}-v2

      - name: Prepare Environment
        shell: bash
        run: |
          set -euo pipefail
          ln -sf "${{ runner.temp }}/ohos-sdk" "${{ github.workspace }}/../ohos-sdk"
          echo "DEVECO_SDK_HOME=${{ github.workspace }}/../ohos-sdk" >> "$GITHUB_ENV"
          echo "OHOS_SDK_HOME=${{ github.workspace }}/../ohos-sdk/linux" >> "$GITHUB_ENV"
          echo "HARMONY_SDK_HOME=${{ github.workspace }}/../ohos-sdk/linux" >> "$GITHUB_ENV"

      - name: Install Hvigor Toolchain
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          npm install --no-save --registry "$HVIGOR_NPM_REGISTRY" \
            "@ohos/hvigor@$HVIGOR_VERSION" \
            "@ohos/hvigor-ohos-plugin@$HVIGOR_VERSION"
          HVIGOR_ENTRY="$GITHUB_WORKSPACE/node_modules/@ohos/hvigor/bin/hvigor.js"
          test -f "$HVIGOR_ENTRY"
          echo "Resolved hvigor entry: $HVIGOR_ENTRY"
          echo "HVIGOR_ENTRY=$HVIGOR_ENTRY" >> "$GITHUB_ENV"

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -f "$OHOS_SDK_HOME/native/build/cmake/ohos.toolchain.cmake"
          test -d "$OHOS_SDK_HOME/ets"
          test -d "$OHOS_SDK_HOME/toolchains"
          ls -la "$OHOS_SDK_HOME/native" | head -20

      - name: Sync Project
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          node "$HVIGOR_ENTRY" \
          --sync -p product=default --analyze=normal --parallel --incremental --daemon

      - name: Unit Test Build Check
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          node "$HVIGOR_ENTRY" \
          --mode module -p module=entry@default \
          -p unit.test.replace.page=../../../.test/testability/pages/Index \
          -p product=default -p pageType=page -p isLocalTest=true -p unitTestMode=true \
          -p buildRoot=.test UnitTestBuild --analyze=normal --parallel --incremental --daemon
