name: CI Compile Check

env:
  OHOS_SDK_URL: https://repo.huaweicloud.com/harmonyos/os/5.1.0-Release/ohos-sdk-windows_linux-public.tar.gz
  OHOS_SDK_API_DIR: '12'

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  compile-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Restore OHOS SDK Cache
        id: cache-sdk-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ohos-sdk
          key: ohos-sdk-linux-${{ env.OHOS_SDK_API_DIR }}-v1
          restore-keys: |
            ohos-sdk-linux-${{ env.OHOS_SDK_API_DIR }}-

      - name: Download and Extract OHOS SDK
        if: steps.cache-sdk-restore.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/ohos-sdk"
          cd "${{ runner.temp }}"

          CANDIDATE_URLS=(
            "${OHOS_SDK_URL}"
            "https://repo.huaweicloud.com/harmonyos/os/5.0.3-Release/ohos-sdk-windows_linux-public.tar.gz"
            "https://repo.huaweicloud.com/harmonyos/os/5.0.0-Release/ohos-sdk-windows_linux-public.tar.gz"
          )

          DOWNLOADED=0
          for url in "${CANDIDATE_URLS[@]}"; do
            echo "Try download SDK from: $url"
            if wget -q -O sdk.tar.gz "$url"; then
              DOWNLOADED=1
              echo "Downloaded SDK from: $url"
              break
            fi
          done

          if [[ "$DOWNLOADED" -ne 1 ]]; then
            echo "Failed to download OHOS SDK from all candidate URLs"
            exit 1
          fi

          # 先完整解压，再自动探测 linux 目录，避免不同版本压缩包目录结构差异导致失败。
          tar -xzf sdk.tar.gz -C ohos-sdk/

          LINUX_DIR=$(find ohos-sdk -type d -name "linux" | head -1)
          if [[ -z "$LINUX_DIR" ]]; then
            echo "linux directory not found in SDK archive"
            find ohos-sdk -maxdepth 4 -type d | head -40
            exit 1
          fi
          echo "Detected SDK linux dir: $LINUX_DIR"

          # 统一为固定路径，后续步骤始终使用 ohos-sdk/linux。
          if [[ "$LINUX_DIR" != "ohos-sdk/linux" ]]; then
            rm -rf ohos-sdk/linux || true
            ln -s "$(realpath "$LINUX_DIR")" ohos-sdk/linux
          fi

          # 解压 linux 目录下所有 x64 SDK 组件（不仅是 native），以便拿到 hvigor/toolchains。
          ZIP_LIST=$(find -L ohos-sdk/linux -maxdepth 3 -type f -name "*-linux-*-*.zip" | tr '\n' ' ')
          if [[ -z "$ZIP_LIST" ]]; then
            echo "No linux x64 SDK component zip found"
            find -L ohos-sdk/linux -maxdepth 4 -type f | head -80
            exit 1
          fi

          for zip_file in $ZIP_LIST; do
            echo "Extract SDK component: $zip_file"
            unzip -q -o "$zip_file" -d ohos-sdk/linux/
          done

          NATIVE_DIR=$(find -L ohos-sdk/linux -type d -name "native" | head -1)
          if [[ -z "$NATIVE_DIR" ]]; then
            echo "native directory not found after SDK extraction"
            find -L ohos-sdk/linux -maxdepth 5 -type d | head -120
            exit 1
          fi
          mkdir -p "ohos-sdk/linux/${OHOS_SDK_API_DIR}"
          if [[ "$NATIVE_DIR" != "ohos-sdk/linux/${OHOS_SDK_API_DIR}/native" ]]; then
            rm -rf "ohos-sdk/linux/${OHOS_SDK_API_DIR}/native" || true
            mv "$NATIVE_DIR" "ohos-sdk/linux/${OHOS_SDK_API_DIR}/native"
          fi

      - name: Save OHOS SDK Cache
        if: always() && steps.cache-sdk-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ohos-sdk
          key: ohos-sdk-linux-${{ env.OHOS_SDK_API_DIR }}-v1

      - name: Prepare Environment
        shell: bash
        run: |
          set -euo pipefail
          ln -sf "${{ runner.temp }}/ohos-sdk" "${{ github.workspace }}/../ohos-sdk"
          echo "DEVECO_SDK_HOME=${{ github.workspace }}/../ohos-sdk" >> "$GITHUB_ENV"
          echo "OHOS_SDK_HOME=${{ github.workspace }}/../ohos-sdk/linux/${OHOS_SDK_API_DIR}" >> "$GITHUB_ENV"
          echo "HARMONY_SDK_HOME=${{ github.workspace }}/../ohos-sdk/linux/${OHOS_SDK_API_DIR}" >> "$GITHUB_ENV"

      - name: Resolve Hvigor Entry
        shell: bash
        run: |
          set -euo pipefail

          CANDIDATE_JS=(
            "$GITHUB_WORKSPACE/hvigor/hvigor-wrapper.js"
            "$GITHUB_WORKSPACE/hvigor/hvigorw.js"
            "$DEVECO_SDK_HOME/tools/hvigor/bin/hvigorw.js"
            "$DEVECO_SDK_HOME/toolchains/hvigor/bin/hvigorw.js"
            "$DEVECO_SDK_HOME/linux/tools/hvigor/bin/hvigorw.js"
            "$DEVECO_SDK_HOME/linux/toolchains/hvigor/bin/hvigorw.js"
            "$OHOS_SDK_HOME/tools/hvigor/bin/hvigorw.js"
            "$OHOS_SDK_HOME/toolchains/hvigor/bin/hvigorw.js"
          )

          CANDIDATE_BIN=(
            "$GITHUB_WORKSPACE/hvigorw"
            "$DEVECO_SDK_HOME/tools/hvigor/bin/hvigorw"
            "$DEVECO_SDK_HOME/toolchains/hvigor/bin/hvigorw"
            "$DEVECO_SDK_HOME/linux/tools/hvigor/bin/hvigorw"
            "$DEVECO_SDK_HOME/linux/toolchains/hvigor/bin/hvigorw"
            "$OHOS_SDK_HOME/tools/hvigor/bin/hvigorw"
            "$OHOS_SDK_HOME/toolchains/hvigor/bin/hvigorw"
          )

          HVIGOR_TYPE=""
          HVIGOR_ENTRY=""
          for candidate in "${CANDIDATE_JS[@]}"; do
            if [[ -f "$candidate" ]]; then
              HVIGOR_TYPE="node"
              HVIGOR_ENTRY="$candidate"
              break
            fi
          done

          if [[ -z "$HVIGOR_ENTRY" ]]; then
            for candidate in "${CANDIDATE_BIN[@]}"; do
              if [[ -f "$candidate" ]]; then
                HVIGOR_TYPE="bin"
                HVIGOR_ENTRY="$candidate"
                break
              fi
            done
          fi

          if [[ -z "$HVIGOR_ENTRY" ]]; then
            HVIGOR_ENTRY=$(find "$GITHUB_WORKSPACE" "$DEVECO_SDK_HOME" "$OHOS_SDK_HOME" -type f \( -name "hvigorw.js" -o -name "hvigor-wrapper.js" \) | head -1 || true)
            if [[ -n "$HVIGOR_ENTRY" ]]; then
              HVIGOR_TYPE="node"
            fi
          fi

          if [[ -z "$HVIGOR_ENTRY" ]]; then
            HVIGOR_ENTRY=$(find "$GITHUB_WORKSPACE" "$DEVECO_SDK_HOME" "$OHOS_SDK_HOME" -type f -name "hvigorw" | head -1 || true)
            if [[ -n "$HVIGOR_ENTRY" ]]; then
              HVIGOR_TYPE="bin"
            fi
          fi

          if [[ -z "$HVIGOR_ENTRY" ]]; then
            echo "Cannot find hvigor entry script."
            echo "Searched in:"
            echo "  - $GITHUB_WORKSPACE"
            echo "  - $DEVECO_SDK_HOME"
            echo "  - $OHOS_SDK_HOME"
            exit 1
          fi

          echo "Resolved hvigor entry: $HVIGOR_ENTRY ($HVIGOR_TYPE)"
          echo "HVIGOR_TYPE=$HVIGOR_TYPE" >> "$GITHUB_ENV"
          echo "HVIGOR_ENTRY=$HVIGOR_ENTRY" >> "$GITHUB_ENV"

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -f "$OHOS_SDK_HOME/native/build/cmake/ohos.toolchain.cmake"
          ls -la "$OHOS_SDK_HOME/native" | head -20

      - name: Sync Project
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if [[ "$HVIGOR_TYPE" == "node" ]]; then
            node "$HVIGOR_ENTRY" \
            --sync -p product=default --analyze=normal --parallel --incremental --daemon
          else
            chmod +x "$HVIGOR_ENTRY" || true
            "$HVIGOR_ENTRY" \
            --sync -p product=default --analyze=normal --parallel --incremental --daemon
          fi

      - name: Unit Test Build Check
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if [[ "$HVIGOR_TYPE" == "node" ]]; then
            node "$HVIGOR_ENTRY" \
            --mode module -p module=entry@default \
            -p unit.test.replace.page=../../../.test/testability/pages/Index \
            -p product=default -p pageType=page -p isLocalTest=true -p unitTestMode=true \
            -p buildRoot=.test UnitTestBuild --analyze=normal --parallel --incremental --daemon
          else
            chmod +x "$HVIGOR_ENTRY" || true
            "$HVIGOR_ENTRY" \
            --mode module -p module=entry@default \
            -p unit.test.replace.page=../../../.test/testability/pages/Index \
            -p product=default -p pageType=page -p isLocalTest=true -p unitTestMode=true \
            -p buildRoot=.test UnitTestBuild --analyze=normal --parallel --incremental --daemon
          fi
