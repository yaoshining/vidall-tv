name: CI Compile Check

env:
  OHOS_SDK_URL: https://repo.huaweicloud.com/harmonyos/os/5.1.0-Release/ohos-sdk-windows_linux-public.tar.gz
  OHOS_SDK_API_DIR: "18"
  CI_COMPILE_SDK_VERSION: "5.1.0(18)"
  CI_RUNTIME_OS: OpenHarmony
  HVIGOR_NPM_REGISTRY: https://repo.harmonyos.com/npm/
  HVIGOR_VERSION: "6.22.3"
  NODE_VERSION: "20"
  ALLURE_VERSION: "2.34.1"
  REPORTS_BRANCH: "gh-pages"

permissions:
  contents: write

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  compile-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java for Allure
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore OHOS SDK Cache
        id: cache-sdk-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ohos-sdk
          key: ohos-sdk-linux-${{ env.OHOS_SDK_API_DIR }}-v2
          restore-keys: |
            ohos-sdk-linux-${{ env.OHOS_SDK_API_DIR }}-

      - name: Download and Extract OHOS SDK
        if: steps.cache-sdk-restore.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/ohos-sdk"
          cd "${{ runner.temp }}"

          CANDIDATE_SDKS=(
            "${OHOS_SDK_URL}|5.1.0(18)|18"
            "https://repo.huaweicloud.com/harmonyos/os/5.0.3-Release/ohos-sdk-windows_linux-public.tar.gz|5.0.3(18)|18"
            "https://repo.huaweicloud.com/harmonyos/os/5.0.0-Release/ohos-sdk-windows_linux-public.tar.gz|5.0.0(18)|18"
          )

          DOWNLOADED=0
          for candidate in "${CANDIDATE_SDKS[@]}"; do
            IFS='|' read -r url sdk_version api_dir <<< "$candidate"
            echo "Try download SDK from: $url"

            if ! wget -q -O sdk.tar.gz "$url"; then
              echo "Download failed for: $url"
              continue
            fi

            if ! wget -q -O sdk.tar.gz.sha256 "${url}.sha256"; then
              echo "Checksum file missing for: $url"
              rm -f sdk.tar.gz sdk.tar.gz.sha256
              continue
            fi

            expected_sha=$(awk '{print $1}' sdk.tar.gz.sha256 | tr -d '\r')
            actual_sha=$(shasum -a 256 sdk.tar.gz | awk '{print $1}')
            if [[ -z "$expected_sha" || "$actual_sha" != "$expected_sha" ]]; then
              echo "Checksum verify failed for: $url"
              rm -f sdk.tar.gz sdk.tar.gz.sha256
              continue
            fi

            DOWNLOADED=1
            echo "Downloaded SDK from: $url"
            echo "CI_COMPILE_SDK_VERSION=$sdk_version" >> "$GITHUB_ENV"
            echo "OHOS_SDK_API_DIR=$api_dir" >> "$GITHUB_ENV"
            break
          done

          if [[ "$DOWNLOADED" -ne 1 ]]; then
            echo "Failed to download OHOS SDK from all candidate URLs"
            exit 1
          fi

          # 先完整解压，再自动探测 linux 目录，避免不同版本压缩包目录结构差异导致失败。
          tar -xzf sdk.tar.gz -C ohos-sdk/

          LINUX_DIR=$(find ohos-sdk -type d -name "linux" | head -1)
          if [[ -z "$LINUX_DIR" ]]; then
            echo "linux directory not found in SDK archive"
            find ohos-sdk -maxdepth 4 -type d | head -40
            exit 1
          fi
          echo "Detected SDK linux dir: $LINUX_DIR"

          # 统一为固定路径，后续步骤始终使用 ohos-sdk/linux。
          if [[ "$LINUX_DIR" != "ohos-sdk/linux" ]]; then
            rm -rf ohos-sdk/linux || true
            ln -s "$(realpath "$LINUX_DIR")" ohos-sdk/linux
          fi

          # 解压 linux 目录下所有 x64 SDK 组件（不仅是 native），以便拿到 hvigor/toolchains。
          ZIP_LIST=$(find -L ohos-sdk/linux -type f -name "*-linux-*.zip" | tr '\n' ' ')
          if [[ -z "$ZIP_LIST" ]]; then
            ZIP_LIST=$(find -L ohos-sdk/linux -type f -name "*.zip" | tr '\n' ' ')
          fi

          if [[ -z "$ZIP_LIST" ]]; then
            echo "No SDK component zip found under linux directory"
            find -L ohos-sdk/linux -maxdepth 4 -type f | head -80
            exit 1
          fi

          for zip_file in $ZIP_LIST; do
            echo "Extract SDK component: $zip_file"
            unzip -q -o "$zip_file" -d ohos-sdk/linux/
          done

          test -d "ohos-sdk/linux/native"
          test -d "ohos-sdk/linux/toolchains"
          test -d "ohos-sdk/linux/ets"

      - name: Save OHOS SDK Cache
        if: success() && steps.cache-sdk-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ohos-sdk
          key: ohos-sdk-linux-${{ env.OHOS_SDK_API_DIR }}-v2

      - name: Prepare Environment
        shell: bash
        run: |
          set -euo pipefail
          CI_SDK_ROOT="${{ runner.temp }}/ci-sdk"

          # 公共 SDK 压缩包解开后是平铺结构，hvigor 在 OpenHarmony 模式下需要
          # <sdk.dir>/<api>/<component> 的目录布局；这一步在 cache hit 时也必须执行。
          mkdir -p "$CI_SDK_ROOT/${OHOS_SDK_API_DIR}"
          for component in ets js native previewer toolchains; do
            ln -sfn "$(realpath "${{ runner.temp }}/ohos-sdk/linux/$component")" "$CI_SDK_ROOT/${OHOS_SDK_API_DIR}/$component"
          done

          echo "DEVECO_SDK_HOME=$CI_SDK_ROOT" >> "$GITHUB_ENV"
          echo "OHOS_BASE_SDK_HOME=$CI_SDK_ROOT" >> "$GITHUB_ENV"
          echo "OHOS_SDK_HOME=$CI_SDK_ROOT/${OHOS_SDK_API_DIR}" >> "$GITHUB_ENV"
          echo "HARMONY_SDK_HOME=$CI_SDK_ROOT/${OHOS_SDK_API_DIR}" >> "$GITHUB_ENV"

          # local.properties 中的 sdk.dir 优先级高于环境变量，CI 中需要显式改写。
          printf 'sdk.dir=%s\n' "$CI_SDK_ROOT" > "$GITHUB_WORKSPACE/local.properties"

          # 公共 runner 无法直接获取 HarmonyOS 6.0.2 私有 SDK，这里仅在 CI 中
          # 切换到可公开下载的 OpenHarmony 做编译检查，不影响仓库源码。
          python3 - <<'PY'
          import os
          from pathlib import Path

          ci_sdk = os.environ['CI_COMPILE_SDK_VERSION']
          ci_runtime = os.environ['CI_RUNTIME_OS']
          p = Path('build-profile.json5')
          s = p.read_text()
          s = s.replace('"targetSdkVersion": "6.0.2(22)"', f'"targetSdkVersion": "{ci_sdk}",\n        "compileSdkVersion": "{ci_sdk}"')
          s = s.replace('"compatibleSdkVersion": "5.1.1(19)"', f'"compatibleSdkVersion": "{ci_sdk}"')
          s = s.replace('"runtimeOS": "HarmonyOS"', f'"runtimeOS": "{ci_runtime}"')
          p.write_text(s)
          PY

          grep -n "targetSdkVersion\|compileSdkVersion\|compatibleSdkVersion\|runtimeOS" build-profile.json5
          cat "$GITHUB_WORKSPACE/local.properties"

      - name: Install Hvigor Toolchain
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          npm install --no-save --registry "$HVIGOR_NPM_REGISTRY" \
            "@ohos/hvigor@$HVIGOR_VERSION" \
            "@ohos/hvigor-ohos-plugin@$HVIGOR_VERSION"
          HVIGOR_ENTRY="$GITHUB_WORKSPACE/node_modules/@ohos/hvigor/bin/hvigor.js"
          test -f "$HVIGOR_ENTRY"
          echo "Resolved hvigor entry: $HVIGOR_ENTRY"
          echo "HVIGOR_ENTRY=$HVIGOR_ENTRY" >> "$GITHUB_ENV"

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -f "$OHOS_SDK_HOME/native/build/cmake/ohos.toolchain.cmake"
          test -d "$OHOS_SDK_HOME/ets"
          test -d "$OHOS_SDK_HOME/toolchains"
          ls -la "$OHOS_SDK_HOME/native" | head -20

      - name: Restore Harmony Dependency Cache
        id: cache-ohpm-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ci/ohpm-cache
          key: ohpm-cache-${{ runner.os }}-${{ hashFiles('oh-package-lock.json5') }}

      - name: Restore Harmony Dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import json
          import shutil
          import tarfile
          import time
          import urllib.request
          from pathlib import Path
          from urllib.error import HTTPError, URLError

          def download_with_retry(url: str, archive_path: Path) -> None:
            last_error = None
            for attempt in range(1, 6):
              try:
                print(f'Downloading {url} (attempt {attempt}/5)')
                with urllib.request.urlopen(url, timeout=90) as response:
                  archive_path.write_bytes(response.read())
                if archive_path.exists() and archive_path.stat().st_size > 0:
                  return
              except (HTTPError, URLError, TimeoutError, ConnectionResetError) as err:
                last_error = err
                if archive_path.exists():
                  archive_path.unlink()
                print(f'Download failed: {err}')
                if attempt < 5:
                  time.sleep(attempt * 5)
            raise RuntimeError(f'Failed to download {url}: {last_error}')

          def safe_extract_archive(archive_path: Path, dest_dir: Path) -> None:
            root = dest_dir.resolve()
            with tarfile.open(archive_path, 'r:gz') as tar:
              for member in tar.getmembers():
                member_path = Path(member.name)
                if member.issym() or member.islnk() or member_path.is_absolute() or '..' in member_path.parts:
                  raise RuntimeError(f'Unsafe archive member: {member.name}')

                target_path = (root / member.name).resolve()
                try:
                  target_path.relative_to(root)
                except ValueError as err:
                  raise RuntimeError(f'Unsafe archive member: {member.name}') from err

                if member.isdir():
                  target_path.mkdir(parents=True, exist_ok=True)
                  continue

                if not member.isfile():
                  continue

                target_path.parent.mkdir(parents=True, exist_ok=True)
                source = tar.extractfile(member)
                if source is None:
                  continue
                with source, open(target_path, 'wb') as out_file:
                  shutil.copyfileobj(source, out_file)

          root = Path('.')
          lock_path = root / 'oh-package-lock.json5'
          lock = json.loads(lock_path.read_text())
          packages = lock.get('packages', {})
          specifiers = lock.get('specifiers', {})

          oh_modules_dir = root / 'oh_modules'
          cache_dir = root / '.ci' / 'ohpm-cache'
          extract_dir = cache_dir / 'extract'
          oh_modules_dir.mkdir(parents=True, exist_ok=True)
          cache_dir.mkdir(parents=True, exist_ok=True)
          extract_dir.mkdir(parents=True, exist_ok=True)

          for resolved_key in specifiers.values():
            package_meta = packages.get(resolved_key)
            if not package_meta:
              continue
            package_name = package_meta.get('name', '')
            resolved = package_meta.get('resolved', '')
            if len(package_name) == 0 or not resolved.endswith('.har'):
              continue

            if resolved.startswith('http://') or resolved.startswith('https://'):
              archive_name = resolved.split('/')[-1]
              archive_path = cache_dir / archive_name
              if not archive_path.exists():
                print(f'Preparing to download {package_name} from {resolved}')
                download_with_retry(resolved, archive_path)
              else:
                print(f'Using cached archive for {package_name}: {archive_path}')
            else:
              archive_path = (root / resolved).resolve()
              print(f'Using local archive for {package_name}: {archive_path}')

            if not archive_path.exists():
              raise FileNotFoundError(f'Archive not found for {package_name}: {archive_path}')

            safe_name = package_name.replace('/', '__').replace('@', '')
            package_extract_dir = extract_dir / safe_name
            if package_extract_dir.exists():
              shutil.rmtree(package_extract_dir)
            package_extract_dir.mkdir(parents=True, exist_ok=True)

            safe_extract_archive(archive_path, package_extract_dir)

            source_dir = package_extract_dir / 'package'
            if not source_dir.exists():
              raise FileNotFoundError(f'Extracted package dir missing for {package_name}')

            dest_dir = oh_modules_dir / package_name
            dest_dir.parent.mkdir(parents=True, exist_ok=True)
            if dest_dir.exists():
              shutil.rmtree(dest_dir)
            shutil.copytree(source_dir, dest_dir)
            print(f'Restored {package_name} -> {dest_dir}')
          PY
          test -d "$GITHUB_WORKSPACE/oh_modules/@ibestservices/ibest-ui"

      - name: Save Harmony Dependency Cache
        if: success() && steps.cache-ohpm-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ci/ohpm-cache
          key: ohpm-cache-${{ runner.os }}-${{ hashFiles('oh-package-lock.json5') }}

      - name: Sync Project
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE/.ci/reports"
          set -o pipefail
          node "$HVIGOR_ENTRY" \
          --sync -p product=default --analyze=normal --parallel --incremental --daemon \
          2>&1 | tee "$GITHUB_WORKSPACE/.ci/reports/sync-project.log"
          sync_status=${PIPESTATUS[0]}
          echo "SYNC_PROJECT_EXIT_CODE=$sync_status" >> "$GITHUB_ENV"
          exit $sync_status

      - name: Prepare Unit Test Page Template
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path

          page = Path('entry/.test/testability/pages/Index.ets')
          page.parent.mkdir(parents=True, exist_ok=True)
          page.write_text(
              "@Entry\n"
              "@Component\n"
              "struct Index {\n"
              "  build() {\n"
              "    Column() {\n"
              "      Text('Unit Test Entry')\n"
              "    }\n"
              "    .width('100%')\n"
              "    .height('100%')\n"
              "  }\n"
              "}\n"
          )
          print(f'Prepared {page}')
          PY
          test -f "$GITHUB_WORKSPACE/entry/.test/testability/pages/Index.ets"

      - name: Unit Test Build Check
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE/.ci/reports"
          set -o pipefail
          node "$HVIGOR_ENTRY" \
          --mode module -p module=entry@default \
          -p unit.test.replace.page=../../../.test/testability/pages/Index \
          -p product=default -p pageType=page -p isLocalTest=true -p unitTestMode=true \
          -p buildRoot=.test UnitTestBuild --analyze=normal --parallel --incremental --daemon \
          2>&1 | tee "$GITHUB_WORKSPACE/.ci/reports/unit-test-build.log"
          unit_test_status=${PIPESTATUS[0]}
          echo "UNIT_TEST_BUILD_EXIT_CODE=$unit_test_status" >> "$GITHUB_ENV"
          exit $unit_test_status

      - name: Generate CI Summary Report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.ci/reports"
          sync_status="${SYNC_PROJECT_EXIT_CODE:-unknown}"
          unit_test_status="${UNIT_TEST_BUILD_EXIT_CODE:-unknown}"
          overall_status="${{ job.status }}"
          export REPORT_SYNC_STATUS="$sync_status"
          export REPORT_UNIT_STATUS="$unit_test_status"
          export REPORT_OVERALL_STATUS="$overall_status"

          cat > "$GITHUB_WORKSPACE/.ci/reports/ci-summary.md" <<EOF
          # Allure Style CI Report

          - Job status: ${overall_status}
          - Sync Project exit code: ${sync_status}
          - Unit Test Build exit code: ${unit_test_status}

          ## Included artifacts
          - sync-project.log
          - unit-test-build.log
          - allure-style-report.html
          - junit-report.xml
          - meta.json
          EOF

          python3 - <<'PY'
          import datetime
          import hashlib
          import html
          import json
          import os
          import uuid
          from pathlib import Path

          reports = Path(os.environ['GITHUB_WORKSPACE']) / '.ci' / 'reports'
          sync_status = os.environ.get('REPORT_SYNC_STATUS', 'unknown')
          unit_status = os.environ.get('REPORT_UNIT_STATUS', 'unknown')
          overall_status = os.environ.get('REPORT_OVERALL_STATUS', 'unknown')
          run_number = os.environ.get('GITHUB_RUN_NUMBER', 'local')
          branch = os.environ.get('GITHUB_REF_NAME', 'unknown')
          sha = os.environ.get('GITHUB_SHA', 'unknown')[:7]
          generated_at = datetime.datetime.utcnow().strftime('%Y-%m-%d %H:%M:%S UTC')

          def state_for(code: str) -> str:
            if code == '0':
              return 'passed'
            if code == 'unknown':
              return 'unknown'
            return 'failed'

          def read_text(name: str) -> str:
            path = reports / name
            if path.exists():
              return html.escape(path.read_text(encoding='utf-8', errors='ignore')[-20000:])
            return 'No log captured.'

          checks = [
            ('Sync Project', state_for(sync_status), sync_status),
            ('Unit Test Build', state_for(unit_status), unit_status)
          ]
          passed = sum(1 for _, state, _ in checks if state == 'passed')
          failed = sum(1 for _, state, _ in checks if state == 'failed')
          unknown = sum(1 for _, state, _ in checks if state == 'unknown')

          rows = []
          for name, state, code in checks:
            badge_class = 'passed' if state == 'passed' else ('failed' if state == 'failed' else 'unknown')
            rows.append(
              f'<tr><td>{html.escape(name)}</td><td><span class="badge {badge_class}">{html.escape(state.upper())}</span></td><td>{html.escape(code)}</td></tr>'
            )

          html_report = '\n'.join([
            '<!DOCTYPE html>',
            '<html lang="zh-CN">',
            '<head>',
            '  <meta charset="UTF-8" />',
            '  <title>Allure Style CI Report</title>',
            '  <style>',
            '    body { font-family: Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; margin: 0; background: #f5f7fb; color: #1f2937; }',
            '    .hero { background: linear-gradient(135deg, #6d28d9, #2563eb); color: white; padding: 28px 32px; }',
            '    .hero h1 { margin: 0 0 8px; font-size: 28px; }',
            '    .container { padding: 24px 32px 40px; }',
            '    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 18px; }',
            '    .card { background: white; border-radius: 14px; padding: 16px 18px; box-shadow: 0 6px 20px rgba(15, 23, 42, 0.08); }',
            '    .label { color: #6b7280; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }',
            '    .value { font-size: 26px; font-weight: 700; margin-top: 6px; }',
            '    .table-wrap, .log-wrap { background: white; border-radius: 14px; padding: 18px; box-shadow: 0 6px 20px rgba(15, 23, 42, 0.08); margin-top: 16px; }',
            '    table { width: 100%; border-collapse: collapse; }',
            '    th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid #e5e7eb; }',
            '    .badge { display: inline-block; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; }',
            '    .passed { background: #dcfce7; color: #166534; }',
            '    .failed { background: #fee2e2; color: #991b1b; }',
            '    .unknown { background: #fef3c7; color: #92400e; }',
            '    details { margin-top: 12px; }',
            '    summary { cursor: pointer; font-weight: 600; }',
            '    pre { background: #0f172a; color: #e2e8f0; border-radius: 10px; padding: 14px; overflow: auto; white-space: pre-wrap; word-break: break-word; }',
            '  </style>',
            '</head>',
            '<body>',
            f'  <div class="hero"><h1>Allure Style CI Report</h1><div>Run #{html.escape(run_number)} · {html.escape(branch)} · {html.escape(sha)} · {html.escape(generated_at)}</div></div>',
            '  <div class="container">',
            '    <div class="grid">',
            f'      <div class="card"><div class="label">Overall Status</div><div class="value">{html.escape(overall_status.upper())}</div></div>',
            f'      <div class="card"><div class="label">Passed Checks</div><div class="value">{passed}</div></div>',
            f'      <div class="card"><div class="label">Failed Checks</div><div class="value">{failed}</div></div>',
            f'      <div class="card"><div class="label">Unknown Checks</div><div class="value">{unknown}</div></div>',
            '    </div>',
            '    <div class="table-wrap">',
            '      <h2>Checks Overview</h2>',
            '      <table>',
            '        <thead><tr><th>Check</th><th>Status</th><th>Exit Code</th></tr></thead>',
            '        <tbody>',
            *rows,
            '        </tbody>',
            '      </table>',
            '    </div>',
            '    <div class="log-wrap">',
            '      <h2>Execution Logs</h2>',
            '      <details open><summary>Sync Project Log</summary>',
            f'        <pre>{read_text("sync-project.log")}</pre>',
            '      </details>',
            '      <details><summary>Unit Test Build Log</summary>',
            f'        <pre>{read_text("unit-test-build.log")}</pre>',
            '      </details>',
            '    </div>',
            '  </div>',
            '</body>',
            '</html>'
          ])
          (reports / 'allure-style-report.html').write_text(html_report, encoding='utf-8')
          (reports / 'ci-summary.html').write_text(html_report, encoding='utf-8')
          (reports / 'index.html').write_text(html_report, encoding='utf-8')
          (reports / '404.html').write_text(html_report, encoding='utf-8')

          junit_lines = [
            '<?xml version="1.0" encoding="UTF-8"?>',
            f'<testsuite name="VidAll TV CI" tests="2" failures="{failed}" errors="0" skipped="{unknown}">'
          ]
          for name, state, code in checks:
            junit_lines.append(f'  <testcase classname="ci.compile" name="{html.escape(name)}">')
            if state == 'failed':
              junit_lines.append(f'    <failure message="exit code {html.escape(code)}">{html.escape(name)} failed with exit code {html.escape(code)}</failure>')
            elif state == 'unknown':
              junit_lines.append(f'    <skipped message="unknown status">{html.escape(name)} status unknown</skipped>')
            junit_lines.append('  </testcase>')
          junit_lines.append('</testsuite>')
          (reports / 'junit-report.xml').write_text('\n'.join(junit_lines), encoding='utf-8')

          metadata = {
            'run_number': run_number,
            'branch': branch,
            'sha': sha,
            'generated_at': generated_at,
            'overall_status': overall_status,
            'sync_exit_code': sync_status,
            'unit_test_exit_code': unit_status,
            'passed': passed,
            'failed': failed,
            'unknown': unknown
          }
          (reports / 'meta.json').write_text(json.dumps(metadata, ensure_ascii=False, indent=2), encoding='utf-8')

          allure_results = Path(os.environ['GITHUB_WORKSPACE']) / '.ci' / 'allure-results'
          allure_results.mkdir(parents=True, exist_ok=True)
          (allure_results / 'environment.properties').write_text(
            f'Branch={branch}\nCommit={sha}\nRun={run_number}\nOverallStatus={overall_status}\n',
            encoding='utf-8'
          )
          executor = {
            'name': 'GitHub Actions',
            'type': 'github',
            'url': f"https://github.com/{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}",
            'buildOrder': int(run_number) if str(run_number).isdigit() else 0,
            'buildName': f'Run #{run_number}',
            'buildUrl': f"https://github.com/{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}",
            'reportName': 'VidAll TV CI Allure Report'
          }
          (allure_results / 'executor.json').write_text(json.dumps(executor, ensure_ascii=False, indent=2), encoding='utf-8')

          for name, state, code, log_name in [
            ('Sync Project', state_for(sync_status), sync_status, 'sync-project.log'),
            ('Unit Test Build', state_for(unit_status), unit_status, 'unit-test-build.log')
          ]:
            attachment_source = f"{uuid.uuid4()}-attachment.txt"
            log_path = reports / log_name
            attachment_text = log_path.read_text(encoding='utf-8', errors='ignore') if log_path.exists() else 'No log captured.'
            (allure_results / attachment_source).write_text(attachment_text, encoding='utf-8')
            result_status = 'passed' if state == 'passed' else ('failed' if state == 'failed' else 'skipped')
            history_id = hashlib.md5(name.encode('utf-8')).hexdigest()
            result = {
              'uuid': str(uuid.uuid4()),
              'historyId': history_id,
              'testCaseId': history_id,
              'name': name,
              'fullName': f'ci.compile::{name}',
              'status': result_status,
              'stage': 'finished',
              'statusDetails': {
                'message': f'Exit code: {code}'
              },
              'attachments': [
                {
                  'name': log_name,
                  'source': attachment_source,
                  'type': 'text/plain'
                }
              ],
              'labels': [
                {'name': 'suite', 'value': 'CI Compile Check'},
                {'name': 'framework', 'value': 'GitHub Actions'},
                {'name': 'host', 'value': 'ubuntu-22.04'}
              ],
              'parameters': [
                {'name': 'branch', 'value': branch},
                {'name': 'sha', 'value': sha},
                {'name': 'run_number', 'value': str(run_number)}
              ]
            }
            (allure_results / f"{uuid.uuid4()}-result.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2),
              encoding='utf-8'
            )
          PY

          {
            echo "## Allure Style CI Report"
            echo ""
            echo "- Job status: ${overall_status}"
            echo "- Sync Project exit code: ${sync_status}"
            echo "- Unit Test Build exit code: ${unit_test_status}"
            echo ""
            echo "Allure-style HTML report has been uploaded in the artifact bundle."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare Historical Report Site
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SITE_DIR="$GITHUB_WORKSPACE/pages-site"
          REPORTS_DIR="$GITHUB_WORKSPACE/.ci/reports"
          ALLURE_RESULTS_DIR="$GITHUB_WORKSPACE/.ci/allure-results"
          ALLURE_REPORT_DIR="$GITHUB_WORKSPACE/.ci/allure-report"
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          rm -rf "$SITE_DIR"
          if git clone --depth 1 --branch "$REPORTS_BRANCH" "$REPO_URL" "$SITE_DIR" 2>/dev/null; then
            echo "Loaded existing history branch: $REPORTS_BRANCH"
          else
            mkdir -p "$SITE_DIR"
            cd "$SITE_DIR"
            git init
            git checkout -b "$REPORTS_BRANCH"
          fi

          cd "$SITE_DIR"
          touch .nojekyll

          if [[ -d "$SITE_DIR/history" ]]; then
            rm -rf "$ALLURE_RESULTS_DIR/history"
            cp -R "$SITE_DIR/history" "$ALLURE_RESULTS_DIR/history"
          fi

          rm -rf "$ALLURE_REPORT_DIR"
          npx --yes "allure-commandline@${ALLURE_VERSION}" generate "$ALLURE_RESULTS_DIR" --clean -o "$ALLURE_REPORT_DIR"

          find "$SITE_DIR" -mindepth 1 -maxdepth 1 ! -name ".git" ! -name "runs" -exec rm -rf {} +
          cp -R "$ALLURE_REPORT_DIR/." "$SITE_DIR/"

          mkdir -p runs latest
          RUN_DIR="runs/run-${GITHUB_RUN_NUMBER}"
          rm -rf "$RUN_DIR" latest/*
          mkdir -p "$RUN_DIR/artifacts" latest/artifacts
          cp -R "$ALLURE_REPORT_DIR/." "$RUN_DIR/"
          cp -R "$ALLURE_REPORT_DIR/." latest/
          cp -R "$REPORTS_DIR/." "$RUN_DIR/artifacts/"
          cp -R "$REPORTS_DIR/." latest/artifacts/

          export PAGES_SITE_DIR="$SITE_DIR"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          site = Path(os.environ['PAGES_SITE_DIR'])
          runs_dir = site / 'runs'
          entries = []
          for meta_path in runs_dir.glob('*/meta.json'):
            try:
              meta = json.loads(meta_path.read_text(encoding='utf-8'))
            except Exception:
              continue
            folder = meta_path.parent.name
            meta['folder'] = folder
            entries.append(meta)

          def run_sort_key(item):
            try:
              return int(str(item.get('run_number', '0')))
            except ValueError:
              return 0

          entries.sort(key=run_sort_key, reverse=True)
          rows = []
          for item in entries:
            status = str(item.get('overall_status', 'unknown')).upper()
            run_number = str(item.get('run_number', 'unknown'))
            rows.append(
              f"<tr><td><a href='runs/{item['folder']}/index.html'>Run #{run_number}</a></td><td>{status}</td><td>{item.get('branch', '-')}</td><td>{item.get('sha', '-')}</td><td>{item.get('generated_at', '-')}</td></tr>"
            )

          index_html = '\n'.join([
            '<!DOCTYPE html>',
            '<html lang="zh-CN">',
            '<head>',
            '  <meta charset="UTF-8" />',
            '  <title>VidAll TV Test Reports Archive</title>',
            '  <style>',
            '    body { font-family: Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; margin: 0; background: #f5f7fb; color: #1f2937; }',
            '    .hero { background: linear-gradient(135deg, #0f172a, #2563eb); color: white; padding: 28px 32px; }',
            '    .container { padding: 24px 32px 40px; }',
            '    .card { background: white; border-radius: 14px; padding: 18px; box-shadow: 0 6px 20px rgba(15, 23, 42, 0.08); }',
            '    table { width: 100%; border-collapse: collapse; }',
            '    th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid #e5e7eb; }',
            '    a { color: #2563eb; text-decoration: none; }',
            '  </style>',
            '</head>',
            '<body>',
            '  <div class="hero">',
            '    <h1>VidAll TV Test Reports Archive</h1>',
            '    <p>首页已切换为官方 Allure 报告。历史列表见本页。</p>',
            '  </div>',
            '  <div class="container">',
            '    <div class="card">',
            '      <p><a href="../index.html">返回最新 Allure 报告</a></p>',
            '      <h2>Run History</h2>',
            '      <table>',
            '        <thead><tr><th>Run</th><th>Status</th><th>Branch</th><th>Commit</th><th>Generated At</th></tr></thead>',
            '        <tbody>',
            *rows,
            '        </tbody>',
            '      </table>',
            '    </div>',
            '  </div>',
            '</body>',
            '</html>'
          ])
          archive_dir = site / 'history-list'
          archive_dir.mkdir(parents=True, exist_ok=True)
          (archive_dir / 'index.html').write_text(index_html, encoding='utf-8')
          if (site / 'index.html').exists():
            (site / '404.html').write_text((site / 'index.html').read_text(encoding='utf-8'), encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "更新: 保存测试报告 #${GITHUB_RUN_NUMBER}" || echo "No report history changes to commit"
          git push "$REPO_URL" HEAD:"$REPORTS_BRANCH" || echo "History branch push skipped"
          rm -rf "$SITE_DIR/.git"

      - name: Inspect Pages Build Directory
        if: always()
        shell: bash
        run: |
          echo "Inspecting GitHub Pages site directory"
          find "$GITHUB_WORKSPACE/pages-site" -maxdepth 3 | sort | sed -n '1,120p'

      - name: GitHub Pages Publish Summary
        if: always()
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          {
            echo "## GitHub Pages Publish"
            echo ""
            echo "- Publish branch: ${REPORTS_BRANCH}"
            echo "- If GitHub Pages is enabled for this repository, the site will be served from:"
            echo "  https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/"
            echo "- Official Allure homepage: https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/"
            echo "- Archive list: https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/history-list/"
            echo "- First-time setup: Settings -> Pages -> Deploy from a branch -> ${REPORTS_BRANCH} /(root)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CI Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-style-ci-report-${{ github.run_number }}
          path: |
            ${{ github.workspace }}/.ci/reports/**
          if-no-files-found: warn
          retention-days: 14
