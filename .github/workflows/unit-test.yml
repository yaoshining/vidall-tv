name: 单元测试（iMac）

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

concurrency:
  group: harmonyos-unit-test
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: write

env:
  REPORTS_BRANCH: "gh-pages"

jobs:
  unit-test:
    name: 单元测试（iMac self-hosted）
    runs-on:
      - self-hosted
      - macOS
      - harmonyos-tv-test
    timeout-minutes: 15

    env:
      DEVECO_SDK_HOME: /Applications/DevEco-Studio.app/Contents/sdk
      OHOS_SDK_HOME: /Applications/DevEco-Studio.app/Contents/sdk/default/openharmony
      HARMONY_SDK_HOME: /Applications/DevEco-Studio.app/Contents/sdk/default/openharmony
      NODE_BIN: /Applications/DevEco-Studio.app/Contents/tools/node/bin/node
      HVIGOR_WRAPPER: /Applications/DevEco-Studio.app/Contents/tools/hvigor/bin/hvigorw.js
      WORK_DIR: /Users/shiningyao/DevecostudioProjects/vidall-tv

    steps:
      - name: 同步最新代码（git pull）
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK_DIR"
          git pull

      - name: 执行单元测试
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -o pipefail
          cd "$WORK_DIR"
          mkdir -p "$RUNNER_TEMP"
          "$NODE_BIN" "$HVIGOR_WRAPPER" \
            --mode module -p module=entry@default \
            test --no-daemon -p coverage=true \
            2>&1 | tee "$RUNNER_TEMP/unit-test.log"
          exit ${PIPESTATUS[0]}

      - name: 发布报告到 gh-pages
        if: always()
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          GH_TOKEN: ${{ github.token }}
          ALLURE_VERSION: "3.6.0"
        run: |
          set -euo pipefail
          REPORT_SRC="$WORK_DIR/entry/.test/default/outputs/test/reports"
          TEST_LOG="$RUNNER_TEMP/unit-test.log"
          SITE_DIR="$RUNNER_TEMP/gh-pages-site"
          ALLURE_RESULTS_DIR="$RUNNER_TEMP/allure-results"
          ALLURE_REPORT_DIR="$RUNNER_TEMP/allure-report"
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # 解析测试结果（从 test_result.txt 读取，比日志解析更可靠）
          RESULT_TXT="$WORK_DIR/entry/.test/default/intermediates/test/coverage_data/test_result.txt"
          if [ -f "$RESULT_TXT" ]; then
            TESTS_LINE=$(grep "Tests run:" "$RESULT_TXT" | tail -1)
            PASSED=$(echo "$TESTS_LINE" | grep -oE 'Pass: [0-9]+' | grep -oE '[0-9]+' || echo "0")
            FAILED=$(echo "$TESTS_LINE" | grep -oE 'Failure: [0-9]+' | grep -oE '[0-9]+' || echo "0")
            TOTAL=$(echo "$TESTS_LINE"  | grep -oE 'Tests run: [0-9]+' | grep -oE '[0-9]+' || echo "0")
          else
            echo "警告：test_result.txt 未找到，回退到日志解析"
            TESTS_LINE=$(grep "Tests run:" "$TEST_LOG" 2>/dev/null | tail -1 || echo "")
            PASSED=$(echo "$TESTS_LINE" | grep -oE 'Pass: [0-9]+' | grep -oE '[0-9]+' || echo "0")
            FAILED=$(echo "$TESTS_LINE" | grep -oE 'Failure: [0-9]+' | grep -oE '[0-9]+' || echo "0")
            TOTAL=$(echo "$TESTS_LINE"  | grep -oE 'Tests run: [0-9]+' | grep -oE '[0-9]+' || echo "0")
          fi
          if [ "$FAILED" = "0" ] && [ "$TOTAL" != "0" ]; then STATUS="passed"
          elif [ "$FAILED" != "0" ]; then STATUS="partial"
          else STATUS="failed"; fi
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # clone gh-pages（最多重试 3 次，规避 macOS LibreSSL 偶发 SSL 握手失败）
          rm -rf "$SITE_DIR"
          CLONED=false
          for attempt in 1 2 3; do
            if git clone --depth 1 --branch "$REPORTS_BRANCH" "$REPO_URL" "$SITE_DIR" 2>/dev/null; then
              echo "已加载现有 gh-pages 分支（第 $attempt 次尝试）"
              CLONED=true
              break
            fi
            echo "clone 第 $attempt 次失败，${attempt}0 秒后重试..."
            sleep $((attempt * 10))
          done
          if [ "$CLONED" = "false" ]; then
            echo "gh-pages 分支不存在，初始化新分支"
            mkdir -p "$SITE_DIR" && cd "$SITE_DIR"
            git init && git checkout -b "$REPORTS_BRANCH"
          fi
          cd "$SITE_DIR"
          touch .nojekyll

          # 写 unit-status.json
          cat > unit-status.json <<JSON
          {
            "status": "${STATUS}",
            "passed": ${PASSED},
            "failed": ${FAILED},
            "total": ${TOTAL},
            "run_number": "${GITHUB_RUN_NUMBER}",
            "timestamp": "${TIMESTAMP}",
            "run_url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          JSON

          # 生成 allure-results JSON（逐条解析 test_result.txt）
          mkdir -p "$ALLURE_RESULTS_DIR"
          export RESULT_TXT ALLURE_RESULTS_DIR GITHUB_RUN_NUMBER GITHUB_REPOSITORY GITHUB_RUN_ID
          python3 - <<'PY'
          import json, os, uuid
          from pathlib import Path
          from datetime import datetime, timezone
          result_txt  = Path(os.environ['RESULT_TXT'])
          allure_dir  = Path(os.environ['ALLURE_RESULTS_DIR'])
          run_number  = os.environ['GITHUB_RUN_NUMBER']
          repo        = os.environ['GITHUB_REPOSITORY']
          run_id      = os.environ['GITHUB_RUN_ID']
          now_ms      = int(datetime.now(timezone.utc).timestamp() * 1000)
          current_suite = 'unit'
          pending: dict = {}
          test_cases: list = []
          if result_txt.exists():
            for line in result_txt.read_text(encoding='utf-8').splitlines():
              if line.startswith('class='):
                current_suite = line[6:].strip()
              elif line.startswith('test='):
                pending = {'suite': current_suite, 'name': line[5:].strip(), 'status': 'broken'}
              elif line.startswith('result=') and pending:
                r = line[7:].strip()
                if r == 'Success':  pending['status'] = 'passed'
                elif r == 'Failure': pending['status'] = 'failed'
                else:                pending['status'] = 'broken'
                test_cases.append(pending)
                pending = {}
          for tc in test_cases:
            hid = f"{tc['suite']}#{tc['name']}"
            res: dict = {
              'uuid': str(uuid.uuid4()),
              'historyId': hid, 'testCaseId': hid,
              'name': tc['name'],
              'fullName': f"{tc['suite']}#{tc['name']}",
              'status': tc['status'],
              'stage': 'finished',
              'start': now_ms, 'stop': now_ms,
              'labels': [
                {'name': 'suite',      'value': tc['suite']},
                {'name': 'framework',  'value': 'hvigorw / hypium'},
                {'name': 'host',       'value': 'iMac self-hosted runner'},
              ],
              'links': [
                {'name': f'Actions #{run_number}',
                 'url':  f'https://github.com/{repo}/actions/runs/{run_id}',
                 'type': 'link'},
              ],
            }
            (allure_dir / f"{res['uuid']}-result.json").write_text(
              json.dumps(res, ensure_ascii=False), encoding='utf-8')
          print(f"已生成 {len(test_cases)} 条 allure-results JSON")
          PY

          # 复制 Allure history（Allure 3 格式；跳过旧 Allure 2 history 避免不兼容）
          # Allure 3 history 文件包含 history-trend.json，Allure 2 格式不含此文件
          if [[ -d "$SITE_DIR/unit/history" ]] && [[ -f "$SITE_DIR/unit/history/history-trend.json" ]]; then
            echo "复制 Allure 3 历史 trend 数据..."
            cp -R "$SITE_DIR/unit/history" "$ALLURE_RESULTS_DIR/history"
          else
            echo "未找到 Allure 3 兼容 history，从本次开始建立新趋势图"
            # 清除旧 Allure 2 history，避免污染
            rm -rf "$SITE_DIR/unit/history"
          fi

          # 生成 Allure 3 HTML 报告
          echo "生成 Allure 3 HTML 报告（allure@${ALLURE_VERSION}）..."
          rm -rf "$ALLURE_REPORT_DIR"
          npx --yes "allure@${ALLURE_VERSION}" generate "$ALLURE_RESULTS_DIR" --output "$ALLURE_REPORT_DIR"

          # 复制 Allure 报告到 unit/runs/run-N/
          RUN_REPORT_DIR="unit/runs/run-${GITHUB_RUN_NUMBER}"
          mkdir -p "$RUN_REPORT_DIR"
          cp -R "$ALLURE_REPORT_DIR/." "$RUN_REPORT_DIR/"
          echo "Allure 报告已复制到 $RUN_REPORT_DIR"

          # 覆盖率报告放 unit/runs/run-N/coverage/detail/（保留行级详情）
          if [ -d "$REPORT_SRC" ]; then
            mkdir -p "$RUN_REPORT_DIR/coverage/detail"
            cp -r "$REPORT_SRC/." "$RUN_REPORT_DIR/coverage/detail/"
            echo "覆盖率报告已复制到 $RUN_REPORT_DIR/coverage/detail/"
          fi

          # 写入 unit-history.json、coverage-history.json，并生成覆盖率汇总页
          export SITE_DIR RUN_NUMBER="${GITHUB_RUN_NUMBER}" RUN_STATUS="${STATUS}" \
            RUN_PASSED="${PASSED}" RUN_FAILED="${FAILED}" RUN_TOTAL="${TOTAL}" \
            RUN_TIMESTAMP="${TIMESTAMP}" RUN_REPORT_DIR_ENV="${RUN_REPORT_DIR}"
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          site        = Path(os.environ['SITE_DIR'])
          run_number  = int(os.environ['RUN_NUMBER'])
          run_status  = os.environ['RUN_STATUS']
          run_passed  = int(os.environ['RUN_PASSED'])
          run_failed  = int(os.environ['RUN_FAILED'])
          run_total   = int(os.environ['RUN_TOTAL'])
          run_ts      = os.environ['RUN_TIMESTAMP']
          run_dir     = site / os.environ['RUN_REPORT_DIR_ENV']
          cov_dir     = run_dir / 'coverage'

          # ─── 1. 从 istanbul coverage-summary.json 生成 coverageReport.json ───────
          cov_report = None
          cov_summary = cov_dir / 'detail' / 'coverage-summary.json'
          if cov_summary.exists():
          try:
          raw    = json.loads(cov_summary.read_text(encoding='utf-8'))
          totals = raw.get('total', {})
          files  = []
          for fp, data in raw.items():
            if fp == 'total':
                continue
            parts = fp.replace('\\', '/').split('/')
            short = '/'.join(parts[-2:]) if len(parts) >= 2 else fp
            files.append({'path': short, 'summary': {
                'lines':     data.get('lines', {}),
                'functions': data.get('functions', {}),
                'branches':  data.get('branches', {}),
            }})
          cov_report = {
            'summary': {
                'lines':     totals.get('lines', {}),
                'functions': totals.get('functions', {}),
                'branches':  totals.get('branches', {}),
            },
            'files': files,
          }
          cov_dir.mkdir(parents=True, exist_ok=True)
          (cov_dir / 'coverageReport.json').write_text(
            json.dumps(cov_report, ensure_ascii=False, indent=2), encoding='utf-8')
          print(f'coverageReport.json 已生成（{len(files)} 个文件）')
          except Exception as e:
          print(f'coverageReport.json 生成失败: {e}')

          # ─── 2. 更新 unit-history.json ───────────────────────────────────────────
          hist_path = site / 'unit' / 'unit-history.json'
          try:
          history = json.loads(hist_path.read_text(encoding='utf-8')) if hist_path.exists() else []
          except Exception:
          history = []
          entry: dict = {
          'run_number':  run_number,
          'timestamp':   run_ts,
          'status':      'pass' if run_status == 'passed' else 'fail',
          'passed':      run_passed,
          'failed':      run_failed,
          'total':       run_total,
          'report_href': f'unit/runs/run-{run_number}/index.html',
          }
          if cov_report is not None:
          entry['coverage_href'] = f'unit/runs/run-{run_number}/coverage/index.html'
          history.append(entry)
          history = history[-30:]
          hist_path.parent.mkdir(parents=True, exist_ok=True)
          hist_path.write_text(json.dumps(history, ensure_ascii=False, indent=2), encoding='utf-8')
          print(f'unit-history.json 已更新（{len(history)} 条）')

          # ─── 3. 更新 coverage-history.json ──────────────────────────────────────
          cov_hist: list = []
          cov_hist_path = site / 'unit' / 'coverage-history.json'
          if cov_report is not None:
          try:
          cov_hist = json.loads(cov_hist_path.read_text(encoding='utf-8')) if cov_hist_path.exists() else []
          except Exception:
          cov_hist = []
          cov_hist.append({
          'run_number':    run_number,
          'timestamp':     run_ts,
          'lines_pct':     cov_report['summary']['lines'].get('pct', 0),
          'functions_pct': cov_report['summary']['functions'].get('pct', 0),
          'branches_pct':  cov_report['summary']['branches'].get('pct', 0),
          })
          cov_hist = cov_hist[-30:]
          cov_hist_path.parent.mkdir(parents=True, exist_ok=True)
          cov_hist_path.write_text(json.dumps(cov_hist, ensure_ascii=False, indent=2), encoding='utf-8')
          print(f'coverage-history.json 已更新（{len(cov_hist)} 条）')

          # ─── 4. 生成 coverage/index.html ─────────────────────────────────────────
          if cov_report is not None:
          cov_hist_json = json.dumps(cov_hist, ensure_ascii=False)
          html = """<!DOCTYPE html>
          <html lang="zh-CN">
          <head>
          <meta charset="UTF-8">
          <title>覆盖率 · Run #""" + str(run_number) + """</title>
          <script src="../../../../vendor/tailwind.js"></script>
          <script src="../../../../vendor/echarts.min.js"></script>
          </head>
          <body class="bg-gray-950 text-gray-200 min-h-screen font-sans">
          <div class="max-w-5xl mx-auto px-4 py-10">
          <div class="mb-8">
          <a href="../../index.html" class="text-blue-400 text-sm hover:underline">← 报告首页</a>
          <h1 class="mt-3 text-2xl font-bold text-gray-100">覆盖率报告</h1>
          <p class="mt-1 text-gray-400 text-sm">Run #""" + str(run_number) + """</p>
          </div>
          <div id="metrics" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8"></div>
          <div class="mb-8 bg-gray-900 rounded-xl p-4">
          <h2 class="text-base font-semibold text-gray-300 mb-3">文件覆盖率（行）</h2>
          <div id="bar-chart" style="height:320px"></div>
          </div>
          <div id="trend-wrap" class="mb-8 bg-gray-900 rounded-xl p-4" style="display:none">
          <h2 class="text-base font-semibold text-gray-300 mb-3">历史趋势</h2>
          <div id="trend-chart" style="height:220px"></div>
          </div>
          <div class="mt-8 pt-6 border-t border-gray-800 text-sm">
          <a href="detail/index.html" class="text-blue-400 hover:underline">📋 查看详细行级覆盖率报告 →</a>
          </div>
          </div>
          <script>
          (function(){
          var hist=""" + cov_hist_json + """;
          fetch('./coverageReport.json').then(function(r){return r.json();}).then(function(d){
          var sm=d.summary||{};
          var defs=[{label:'行覆盖率',key:'lines'},{label:'函数覆盖率',key:'functions'},{label:'分支覆盖率',key:'branches'}];
          document.getElementById('metrics').innerHTML=defs.map(function(m){
          var info=sm[m.key]||{};var pct=+(info.pct||0);
          var col=pct>=80?'text-green-400':pct>=50?'text-yellow-400':'text-red-400';
          var bd =pct>=80?'border-green-800':pct>=50?'border-yellow-800':'border-red-800';
          return '<div class="bg-gray-900 border '+bd+' rounded-xl p-5">'
          +'<div class="text-gray-400 text-sm mb-1">'+m.label+'</div>'
          +'<div class="text-3xl font-bold '+col+'">'+pct.toFixed(1)+'%</div>'
          +'<div class="text-gray-500 text-xs mt-1">'+(info.covered||0)+' / '+(info.total||0)+'</div>'
          +'</div>';
          }).join('');
          var files=(d.files||[]).filter(function(f){return f.summary&&f.summary.lines;});
          if(files.length){
          var names=files.map(function(f){return f.path;});
          var vals=files.map(function(f){return+(f.summary.lines.pct||0);});
          var colors=vals.map(function(v){return v>=80?'#4ade80':v>=50?'#facc15':'#f87171';});
          var bar=echarts.init(document.getElementById('bar-chart'),null,{renderer:'svg'});
          bar.setOption({backgroundColor:'transparent',tooltip:{trigger:'axis'},
          grid:{left:'30%',right:'5%',top:'3%',bottom:'3%',containLabel:false},
          xAxis:{type:'value',max:100,axisLabel:{color:'#9ca3af',formatter:'{value}%'},splitLine:{lineStyle:{color:'#374151'}}},
          yAxis:{type:'category',data:names,axisLabel:{color:'#d1d5db',fontSize:11}},
          series:[{type:'bar',data:vals.map(function(v,i){return{value:v,itemStyle:{color:colors[i]}};})
          ,label:{show:true,position:'right',formatter:'{c}%',color:'#9ca3af'}}]});
          }
          if(hist&&hist.length>=2){
          document.getElementById('trend-wrap').style.display='';
          var runs=hist.map(function(h){return'#'+h.run_number;});
          var trend=echarts.init(document.getElementById('trend-chart'),null,{renderer:'svg'});
          trend.setOption({backgroundColor:'transparent',tooltip:{trigger:'axis'},
          legend:{data:['行','函数','分支'],textStyle:{color:'#9ca3af'}},
          grid:{left:'4%',right:'4%',top:'15%',bottom:'8%',containLabel:true},
          xAxis:{type:'category',data:runs,axisLabel:{color:'#9ca3af'}},
          yAxis:{type:'value',max:100,axisLabel:{color:'#9ca3af',formatter:'{value}%'},splitLine:{lineStyle:{color:'#374151'}}},
          series:[
          {name:'行',  type:'line',smooth:true,data:hist.map(function(h){return h.lines_pct;}),itemStyle:{color:'#4ade80'},lineStyle:{color:'#4ade80'}},
          {name:'函数',type:'line',smooth:true,data:hist.map(function(h){return h.functions_pct;}),itemStyle:{color:'#60a5fa'},lineStyle:{color:'#60a5fa'}},
          {name:'分支',type:'line',smooth:true,data:hist.map(function(h){return h.branches_pct;}),itemStyle:{color:'#f59e0b'},lineStyle:{color:'#f59e0b'}}
          ]});
          }
          }).catch(function(e){console.error('覆盖率数据加载失败',e);});
          })();
          </script>
          </body></html>"""
          cov_dir.mkdir(parents=True, exist_ok=True)
          (cov_dir / 'index.html').write_text(html, encoding='utf-8')
          print('coverage/index.html 已生成')
          PY

          # 回写 Allure history 到 gh-pages（供下次 run 使用趋势图）
          if [[ -d "$ALLURE_REPORT_DIR/history" ]]; then
            mkdir -p "$SITE_DIR/unit/history"
            rm -rf "$SITE_DIR/unit/history"/*
            cp -R "$ALLURE_REPORT_DIR/history/." "$SITE_DIR/unit/history/"
          fi

          # 更新 unit/index.html 重定向到最新 run
          mkdir -p unit
          cat > unit/index.html <<HTML
          <!DOCTYPE html>
          <html><head><meta charset="UTF-8">
          <meta http-equiv="refresh" content="0;url=runs/run-${GITHUB_RUN_NUMBER}/index.html">
          </head><body>正在跳转到最新报告...</body></html>
          HTML

          # 生成 unit/history-list/index.html（TailwindCSS 深色风格，读 unit-history.json）
          mkdir -p unit/history-list
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          site     = Path(os.environ['SITE_DIR'])
          hist_p   = site / 'unit' / 'unit-history.json'
          try:
          history = json.loads(hist_p.read_text(encoding='utf-8')) if hist_p.exists() else []
          except Exception:
          history = []
          history  = list(reversed(history))

          rows = ''
          for h in history:
          rn   = h.get('run_number', '-')
          ts   = h.get('timestamp', '')[:19].replace('T', ' ')
          st   = h.get('status', 'fail')
          pa   = h.get('passed', 0)
          fa   = h.get('failed', 0)
          tot  = h.get('total', 0)
          href = h.get('report_href', '#')
          cov  = h.get('coverage_href', '')
          badge = ('<span class="px-2 py-0.5 rounded text-xs font-semibold bg-green-900 text-green-300">通过</span>'
             if st == 'pass' else
             '<span class="px-2 py-0.5 rounded text-xs font-semibold bg-red-900 text-red-300">失败</span>')
          cov_link = (f'<a href="../../{cov}" class="text-blue-400 hover:underline text-xs">覆盖率</a>'
                if cov else '<span class="text-gray-700 text-xs">—</span>')
          rows += (
          '<tr class="border-b border-gray-800 hover:bg-gray-800/50 transition-colors">'
          f'<td class="py-3 px-4 text-gray-300 font-mono">#{rn}</td>'
          f'<td class="py-3 px-4 text-gray-400 text-sm">{ts}</td>'
          f'<td class="py-3 px-4">{badge}</td>'
          f'<td class="py-3 px-4 text-gray-300 text-sm">{pa}/{tot}'
          + (f' <span class="text-red-400">({fa}失败)</span>' if fa else '') + '</td>'
          f'<td class="py-3 px-4"><a href="../../{href}" class="text-blue-400 hover:underline text-sm">查看报告</a></td>'
          f'<td class="py-3 px-4">{cov_link}</td>'
          '</tr>'
          )

          if not rows:
          rows = '<tr><td colspan="6" class="py-8 text-center text-gray-500">暂无历史记录</td></tr>'

          html = """<!DOCTYPE html>
          <html lang="zh-CN">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>单元测试历史记录</title>
          <script src="../../vendor/tailwind.js"></script>
          </head>
          <body class="bg-gray-950 text-gray-200 min-h-screen font-sans">
          <div class="max-w-5xl mx-auto px-4 py-10">
          <div class="mb-8">
          <a href="../../index.html" class="text-blue-400 text-sm hover:underline">← 报告首页</a>
          <h1 class="mt-3 text-2xl font-bold text-gray-100">单元测试历史记录</h1>
          <p class="mt-1 text-gray-400 text-sm">最近 """ + str(len(history)) + """ 次运行</p>
          </div>
          <div class="bg-gray-900 rounded-xl overflow-hidden border border-gray-800">
          <table class="w-full text-left">
          <thead>
          <tr class="border-b border-gray-800 bg-gray-900">
            <th class="py-3 px-4 text-gray-400 font-medium text-sm">Run</th>
            <th class="py-3 px-4 text-gray-400 font-medium text-sm">时间</th>
            <th class="py-3 px-4 text-gray-400 font-medium text-sm">状态</th>
            <th class="py-3 px-4 text-gray-400 font-medium text-sm">通过 / 总计</th>
            <th class="py-3 px-4 text-gray-400 font-medium text-sm">报告</th>
            <th class="py-3 px-4 text-gray-400 font-medium text-sm">覆盖率</th>
          </tr>
          </thead>
          <tbody>""" + rows + """</tbody>
          </table>
          </div>
          </div>
          </body></html>"""

          (site / 'unit' / 'history-list' / 'index.html').write_text(html, encoding='utf-8')
          print(f'unit/history-list/index.html 已生成（{len(history)} 条）')
          PY

          # 重新生成门户 index.html
          export CURRENT_RUN_NUMBER="${GITHUB_RUN_NUMBER}"
          export GITHUB_RUN_URL_ENV="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone

          site = Path(os.environ['SITE_DIR'])

          def load_status(p):
            try: return json.loads(p.read_text(encoding='utf-8')) if p.exists() else None
            except: return None

          def status_badge(s):
            if s is None: return '🔄', '#8b949e', '尚未运行'
            st = s.get('status', 'unknown')
            if st == 'passed': return '✅', '#3fb950', '全部通过'
            elif st == 'partial': return '⚠️', '#d29922', '部分失败'
            else: return '❌', '#f85149', '存在失败'

          def render_card(title, s, report_href, archive_href, coverage_href=None):
            icon, color, label = status_badge(s)
            if s:
              p, f, t = s.get('passed',0), s.get('failed',0), s.get('total',0)
              rate = f'{p} / {t}'
              run_info = f'Run #{s.get("run_number","-")} &nbsp;·&nbsp; {s.get("timestamp","-")[:10]}'
            else:
              rate = '—'; run_info = '暂无记录'
            cov_btn = (f'      <a href="{coverage_href}" style="background:#21262d;color:#8b949e;border:1px solid #30363d;border-radius:6px;padding:7px 16px;font-size:0.9rem;text-decoration:none;">覆盖率报告</a>'
                       if coverage_href else '')
            return '\n'.join(filter(None, [
              '  <div style="background:#161b22;border:1px solid #30363d;border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:12px;">',
              f'    <div style="font-size:1.1rem;font-weight:600;color:#e6edf3;">{title}</div>',
              f'    <div style="font-size:2rem;">{icon} <span style="font-size:1rem;color:{color};font-weight:500;">{label}</span></div>',
              f'    <div style="font-size:1.5rem;font-weight:700;color:#e6edf3;">{rate} <span style="font-size:0.85rem;color:#8b949e;font-weight:400;">用例通过</span></div>',
              f'    <div style="font-size:0.85rem;color:#8b949e;">{run_info}</div>',
              '    <div style="display:flex;gap:10px;margin-top:4px;flex-wrap:wrap;">',
              f'      <a href="{report_href}" style="background:#238636;color:#fff;border-radius:6px;padding:7px 16px;font-size:0.9rem;text-decoration:none;font-weight:500;">查看报告</a>',
              f'      <a href="{archive_href}" style="background:#21262d;color:#58a6ff;border:1px solid #30363d;border-radius:6px;padding:7px 16px;font-size:0.9rem;text-decoration:none;">历史记录</a>',
              cov_btn,
              '    </div>',
              '  </div>',
            ]))

          unit_st = load_status(site / 'unit-status.json')
          intg_st = load_status(site / 'integration-status.json')
          unit_run_num = unit_st.get('run_number','') if unit_st else ''
          intg_run_num = intg_st.get('run_number','') if intg_st else ''
          unit_report_href   = f'unit/runs/run-{unit_run_num}/index.html?v={unit_run_num}' if unit_run_num else 'unit/index.html'
          unit_coverage_href = f'unit/runs/run-{unit_run_num}/coverage/index.html?v={unit_run_num}' if unit_run_num else None
          # integration 报告直接放 integration/index.html（无 runs/ 子目录）
          intg_report_href = f'integration/index.html?v={intg_run_num}' if intg_run_num else 'integration/index.html'

          portal_html = '\n'.join([
            '<!DOCTYPE html>','<html lang="zh-CN">','<head>',
            '  <meta charset="UTF-8" />',
            '  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />',
            '  <meta http-equiv="Pragma" content="no-cache" />','  <meta http-equiv="Expires" content="0" />',
            '  <meta name="viewport" content="width=device-width, initial-scale=1" />',
            '  <title>VidAll TV · 测试报告总览</title>','</head>',
            '<body style="margin:0;background:#0d1117;color:#e6edf3;font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;">',
            '  <div style="max-width:860px;margin:0 auto;padding:40px 20px;">',
            '    <div style="margin-bottom:32px;">',
            '      <h1 style="margin:0 0 6px;font-size:1.6rem;font-weight:700;color:#e6edf3;">VidAll TV 测试报告</h1>',
            '      <p style="margin:0;color:#8b949e;font-size:0.9rem;">单元测试 · 集成测试 · 统一入口</p>',
            '    </div>',
            '    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;">',
            render_card('单元测试', unit_st, unit_report_href, 'unit/history-list/index.html', unit_coverage_href),
            render_card('集成测试', intg_st, intg_report_href, 'integration/history-list/index.html'),
            '    </div>',
            '  </div>','</body>','</html>',
          ])
          (site / 'index.html').write_text(portal_html, encoding='utf-8')
          (site / '404.html').write_text(portal_html, encoding='utf-8')
          PY
          export SITE_DIR="$SITE_DIR"

          # 清理旧 runs，只保留最近 10 次（避免 gh-pages 无限膨胀导致 push HTTP 400）
          # 注意：macOS bash 3.2 无 mapfile，BSD head 不支持负行号，需用 POSIX 写法
          if [ -d "unit/runs" ]; then
            KEEP=10
            TOTAL_RUNS=$(ls -1d unit/runs/run-* 2>/dev/null | wc -l | tr -d ' ')
            if [ "$TOTAL_RUNS" -gt "$KEEP" ]; then
              DELETE_COUNT=$((TOTAL_RUNS - KEEP))
              echo "清理最旧的 $DELETE_COUNT 个 runs（共 $TOTAL_RUNS 个，保留 $KEEP 个）"
              ls -1d unit/runs/run-* 2>/dev/null | sort -t- -k2 -n | head -n "$DELETE_COUNT" | xargs rm -rf
            fi
          fi

          # 推送 gh-pages（最多重试 3 次，增大 postBuffer 避免 HTTP 400）
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git add .
          git commit -m "单元测试报告 #${GITHUB_RUN_NUMBER} (${STATUS}: ${PASSED}/${TOTAL})" || echo "无变更"
          for attempt in 1 2 3; do
            if git push "$REPO_URL" HEAD:"$REPORTS_BRANCH" --force; then
              echo "gh-pages 推送成功（第 $attempt 次尝试）"
              break
            fi
            echo "push 第 $attempt 次失败，${attempt}0 秒后重试..."
            sleep $((attempt * 10))
          done

      - name: 上传测试产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ github.run_number }}
          path: ${{ runner.temp }}/unit-test.log
          if-no-files-found: warn
          retention-days: 7
