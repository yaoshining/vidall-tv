name: 单元测试（iMac）

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

concurrency:
  group: harmonyos-unit-test
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: write

env:
  REPORTS_BRANCH: "gh-pages"

jobs:
  unit-test:
    name: 单元测试（iMac self-hosted）
    runs-on:
      - self-hosted
      - macOS
      - harmonyos-tv-test
    timeout-minutes: 15

    env:
      DEVECO_SDK_HOME: /Applications/DevEco-Studio.app/Contents/sdk
      OHOS_SDK_HOME: /Applications/DevEco-Studio.app/Contents/sdk/default/openharmony
      HARMONY_SDK_HOME: /Applications/DevEco-Studio.app/Contents/sdk/default/openharmony
      NODE_BIN: /Applications/DevEco-Studio.app/Contents/tools/node/bin/node
      HVIGOR_WRAPPER: /Applications/DevEco-Studio.app/Contents/tools/hvigor/bin/hvigorw.js
      WORK_DIR: /Users/shiningyao/DevecostudioProjects/vidall-tv

    steps:
      - name: 同步最新代码（git pull）
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK_DIR"
          git pull

      - name: 执行单元测试
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -o pipefail
          cd "$WORK_DIR"
          mkdir -p "$RUNNER_TEMP"
          "$NODE_BIN" "$HVIGOR_WRAPPER" \
            --mode module -p module=entry@default \
            test --no-daemon \
            2>&1 | tee "$RUNNER_TEMP/unit-test.log"
          exit ${PIPESTATUS[0]}

      - name: 发布报告到 gh-pages
        if: always()
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          GH_TOKEN: ${{ github.token }}
          ALLURE_VERSION: "3"
        run: |
          set -euo pipefail
          REPORT_SRC="$WORK_DIR/entry/.test/default/outputs/test/reports"
          TEST_LOG="$RUNNER_TEMP/unit-test.log"
          SITE_DIR="$RUNNER_TEMP/gh-pages-site"
          ALLURE_RESULTS_DIR="$RUNNER_TEMP/allure-results"
          ALLURE_REPORT_DIR="$RUNNER_TEMP/allure-report"
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # 解析测试结果（从 test_result.txt 读取，比日志解析更可靠）
          RESULT_TXT="$WORK_DIR/entry/.test/default/intermediates/test/coverage_data/test_result.txt"
          if [ -f "$RESULT_TXT" ]; then
            TESTS_LINE=$(grep "Tests run:" "$RESULT_TXT" | tail -1)
            PASSED=$(echo "$TESTS_LINE" | grep -oE 'Pass: [0-9]+' | grep -oE '[0-9]+' || echo "0")
            FAILED=$(echo "$TESTS_LINE" | grep -oE 'Failure: [0-9]+' | grep -oE '[0-9]+' || echo "0")
            TOTAL=$(echo "$TESTS_LINE"  | grep -oE 'Tests run: [0-9]+' | grep -oE '[0-9]+' || echo "0")
          else
            echo "警告：test_result.txt 未找到，回退到日志解析"
            TESTS_LINE=$(grep "Tests run:" "$TEST_LOG" 2>/dev/null | tail -1 || echo "")
            PASSED=$(echo "$TESTS_LINE" | grep -oE 'Pass: [0-9]+' | grep -oE '[0-9]+' || echo "0")
            FAILED=$(echo "$TESTS_LINE" | grep -oE 'Failure: [0-9]+' | grep -oE '[0-9]+' || echo "0")
            TOTAL=$(echo "$TESTS_LINE"  | grep -oE 'Tests run: [0-9]+' | grep -oE '[0-9]+' || echo "0")
          fi
          if [ "$FAILED" = "0" ] && [ "$TOTAL" != "0" ]; then STATUS="passed"
          elif [ "$FAILED" != "0" ]; then STATUS="partial"
          else STATUS="failed"; fi
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # clone gh-pages（最多重试 3 次，规避 macOS LibreSSL 偶发 SSL 握手失败）
          rm -rf "$SITE_DIR"
          CLONED=false
          for attempt in 1 2 3; do
            if git clone --depth 1 --branch "$REPORTS_BRANCH" "$REPO_URL" "$SITE_DIR" 2>/dev/null; then
              echo "已加载现有 gh-pages 分支（第 $attempt 次尝试）"
              CLONED=true
              break
            fi
            echo "clone 第 $attempt 次失败，${attempt}0 秒后重试..."
            sleep $((attempt * 10))
          done
          if [ "$CLONED" = "false" ]; then
            echo "gh-pages 分支不存在，初始化新分支"
            mkdir -p "$SITE_DIR" && cd "$SITE_DIR"
            git init && git checkout -b "$REPORTS_BRANCH"
          fi
          cd "$SITE_DIR"
          touch .nojekyll

          # 写 unit-status.json
          cat > unit-status.json <<JSON
          {
            "status": "${STATUS}",
            "passed": ${PASSED},
            "failed": ${FAILED},
            "total": ${TOTAL},
            "run_number": "${GITHUB_RUN_NUMBER}",
            "timestamp": "${TIMESTAMP}",
            "run_url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          JSON

          # 生成 allure-results JSON（逐条解析 test_result.txt）
          mkdir -p "$ALLURE_RESULTS_DIR"
          export RESULT_TXT ALLURE_RESULTS_DIR GITHUB_RUN_NUMBER GITHUB_REPOSITORY GITHUB_RUN_ID
          python3 - <<'PY'
          import json, os, uuid
          from pathlib import Path
          from datetime import datetime, timezone
          result_txt  = Path(os.environ['RESULT_TXT'])
          allure_dir  = Path(os.environ['ALLURE_RESULTS_DIR'])
          run_number  = os.environ['GITHUB_RUN_NUMBER']
          repo        = os.environ['GITHUB_REPOSITORY']
          run_id      = os.environ['GITHUB_RUN_ID']
          now_ms      = int(datetime.now(timezone.utc).timestamp() * 1000)
          current_suite = 'unit'
          pending: dict = {}
          test_cases: list = []
          if result_txt.exists():
            for line in result_txt.read_text(encoding='utf-8').splitlines():
              if line.startswith('class='):
                current_suite = line[6:].strip()
              elif line.startswith('test='):
                pending = {'suite': current_suite, 'name': line[5:].strip(), 'status': 'broken'}
              elif line.startswith('result=') and pending:
                r = line[7:].strip()
                if r == 'Success':  pending['status'] = 'passed'
                elif r == 'Failure': pending['status'] = 'failed'
                else:                pending['status'] = 'broken'
                test_cases.append(pending)
                pending = {}
          for tc in test_cases:
            hid = f"{tc['suite']}#{tc['name']}"
            res: dict = {
              'uuid': str(uuid.uuid4()),
              'historyId': hid, 'testCaseId': hid,
              'name': tc['name'],
              'fullName': f"{tc['suite']}#{tc['name']}",
              'status': tc['status'],
              'stage': 'finished',
              'start': now_ms, 'stop': now_ms,
              'labels': [
                {'name': 'suite',      'value': tc['suite']},
                {'name': 'framework',  'value': 'hvigorw / hypium'},
                {'name': 'host',       'value': 'iMac self-hosted runner'},
              ],
              'links': [
                {'name': f'Actions #{run_number}',
                 'url':  f'https://github.com/{repo}/actions/runs/{run_id}',
                 'type': 'link'},
              ],
            }
            (allure_dir / f"{res['uuid']}-result.json").write_text(
              json.dumps(res, ensure_ascii=False), encoding='utf-8')
          print(f"已生成 {len(test_cases)} 条 allure-results JSON")
          PY

          # 复制 Allure history（Allure 3 格式；跳过旧 Allure 2 history 避免不兼容）
          # Allure 3 history 文件包含 history-trend.json，Allure 2 格式不含此文件
          if [[ -d "$SITE_DIR/unit/history" ]] && [[ -f "$SITE_DIR/unit/history/history-trend.json" ]]; then
            echo "复制 Allure 3 历史 trend 数据..."
            cp -R "$SITE_DIR/unit/history" "$ALLURE_RESULTS_DIR/history"
          else
            echo "未找到 Allure 3 兼容 history，从本次开始建立新趋势图"
            # 清除旧 Allure 2 history，避免污染
            rm -rf "$SITE_DIR/unit/history"
          fi

          # 生成 Allure 3 HTML 报告
          echo "生成 Allure 3 HTML 报告（@allurereport/cli@${ALLURE_VERSION}）..."
          rm -rf "$ALLURE_REPORT_DIR"
          npx --yes "@allurereport/cli@${ALLURE_VERSION}" generate "$ALLURE_RESULTS_DIR" --output "$ALLURE_REPORT_DIR"

          # 复制 Allure 报告到 unit/runs/run-N/
          RUN_REPORT_DIR="unit/runs/run-${GITHUB_RUN_NUMBER}"
          mkdir -p "$RUN_REPORT_DIR"
          cp -R "$ALLURE_REPORT_DIR/." "$RUN_REPORT_DIR/"
          echo "Allure 报告已复制到 $RUN_REPORT_DIR"

          # 覆盖率报告放 unit/runs/run-N/coverage/（补充）
          if [ -d "$REPORT_SRC" ]; then
            mkdir -p "$RUN_REPORT_DIR/coverage"
            cp -r "$REPORT_SRC/." "$RUN_REPORT_DIR/coverage/"
            echo "覆盖率报告已复制到 $RUN_REPORT_DIR/coverage/"
          fi

          # 回写 Allure history 到 gh-pages（供下次 run 使用趋势图）
          if [[ -d "$ALLURE_REPORT_DIR/history" ]]; then
            mkdir -p "$SITE_DIR/unit/history"
            rm -rf "$SITE_DIR/unit/history"/*
            cp -R "$ALLURE_REPORT_DIR/history/." "$SITE_DIR/unit/history/"
          fi

          # 更新 unit/index.html 重定向到最新 run
          mkdir -p unit
          cat > unit/index.html <<HTML
          <!DOCTYPE html>
          <html><head><meta charset="UTF-8">
          <meta http-equiv="refresh" content="0;url=runs/run-${GITHUB_RUN_NUMBER}/index.html">
          </head><body>正在跳转到最新报告...</body></html>
          HTML

          # 生成 unit/history-list/index.html（修复链接缺 runs/ 层）
          mkdir -p unit/history-list
          export SITE_DIR="$SITE_DIR"
          python3 - <<'PY'
          import os
          from pathlib import Path
          site = Path(os.environ['SITE_DIR'])
          runs_dir = site / 'unit' / 'runs'
          runs = sorted(
            [d.name for d in runs_dir.iterdir() if d.is_dir() and d.name.startswith('run-')],
            reverse=True) if runs_dir.exists() else []
          rows = ''.join(f'<tr><td><a href="../runs/{r}/index.html">{r}</a></td></tr>' for r in runs)
          html = (
            '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>单元测试历史</title></head>'
            f'<body><h1>单元测试历史记录</h1><table>{rows}</table></body></html>'
          )
          (site / 'unit' / 'history-list' / 'index.html').write_text(html, encoding='utf-8')
          PY

          # 重新生成门户 index.html
          export CURRENT_RUN_NUMBER="${GITHUB_RUN_NUMBER}"
          export GITHUB_RUN_URL_ENV="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone

          site = Path(os.environ['SITE_DIR'])

          def load_status(p):
            try: return json.loads(p.read_text(encoding='utf-8')) if p.exists() else None
            except: return None

          def status_badge(s):
            if s is None: return '🔄', '#8b949e', '尚未运行'
            st = s.get('status', 'unknown')
            if st == 'passed': return '✅', '#3fb950', '全部通过'
            elif st == 'partial': return '⚠️', '#d29922', '部分失败'
            else: return '❌', '#f85149', '存在失败'

          def render_card(title, s, report_href, archive_href, coverage_href=None):
            icon, color, label = status_badge(s)
            if s:
              p, f, t = s.get('passed',0), s.get('failed',0), s.get('total',0)
              rate = f'{p} / {t}'
              run_info = f'Run #{s.get("run_number","-")} &nbsp;·&nbsp; {s.get("timestamp","-")[:10]}'
            else:
              rate = '—'; run_info = '暂无记录'
            cov_btn = (f'      <a href="{coverage_href}" style="background:#21262d;color:#8b949e;border:1px solid #30363d;border-radius:6px;padding:7px 16px;font-size:0.9rem;text-decoration:none;">覆盖率报告</a>'
                       if coverage_href else '')
            return '\n'.join(filter(None, [
              '  <div style="background:#161b22;border:1px solid #30363d;border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:12px;">',
              f'    <div style="font-size:1.1rem;font-weight:600;color:#e6edf3;">{title}</div>',
              f'    <div style="font-size:2rem;">{icon} <span style="font-size:1rem;color:{color};font-weight:500;">{label}</span></div>',
              f'    <div style="font-size:1.5rem;font-weight:700;color:#e6edf3;">{rate} <span style="font-size:0.85rem;color:#8b949e;font-weight:400;">用例通过</span></div>',
              f'    <div style="font-size:0.85rem;color:#8b949e;">{run_info}</div>',
              '    <div style="display:flex;gap:10px;margin-top:4px;flex-wrap:wrap;">',
              f'      <a href="{report_href}" style="background:#238636;color:#fff;border-radius:6px;padding:7px 16px;font-size:0.9rem;text-decoration:none;font-weight:500;">查看报告</a>',
              f'      <a href="{archive_href}" style="background:#21262d;color:#58a6ff;border:1px solid #30363d;border-radius:6px;padding:7px 16px;font-size:0.9rem;text-decoration:none;">历史记录</a>',
              cov_btn,
              '    </div>',
              '  </div>',
            ]))

          unit_st = load_status(site / 'unit-status.json')
          intg_st = load_status(site / 'integration-status.json')
          unit_run_num = unit_st.get('run_number','') if unit_st else ''
          intg_run_num = intg_st.get('run_number','') if intg_st else ''
          unit_report_href   = f'unit/runs/run-{unit_run_num}/index.html?v={unit_run_num}' if unit_run_num else 'unit/index.html'
          unit_coverage_href = f'unit/runs/run-{unit_run_num}/coverage/index.html?v={unit_run_num}' if unit_run_num else None
          # integration 报告直接放 integration/index.html（无 runs/ 子目录）
          intg_report_href = f'integration/index.html?v={intg_run_num}' if intg_run_num else 'integration/index.html'

          portal_html = '\n'.join([
            '<!DOCTYPE html>','<html lang="zh-CN">','<head>',
            '  <meta charset="UTF-8" />',
            '  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />',
            '  <meta http-equiv="Pragma" content="no-cache" />','  <meta http-equiv="Expires" content="0" />',
            '  <meta name="viewport" content="width=device-width, initial-scale=1" />',
            '  <title>VidAll TV · 测试报告总览</title>','</head>',
            '<body style="margin:0;background:#0d1117;color:#e6edf3;font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;">',
            '  <div style="max-width:860px;margin:0 auto;padding:40px 20px;">',
            '    <div style="margin-bottom:32px;">',
            '      <h1 style="margin:0 0 6px;font-size:1.6rem;font-weight:700;color:#e6edf3;">VidAll TV 测试报告</h1>',
            '      <p style="margin:0;color:#8b949e;font-size:0.9rem;">单元测试 · 集成测试 · 统一入口</p>',
            '    </div>',
            '    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;">',
            render_card('单元测试', unit_st, unit_report_href, 'unit/history-list/index.html', unit_coverage_href),
            render_card('集成测试', intg_st, intg_report_href, 'integration/history-list/index.html'),
            '    </div>',
            f'    <p style="margin-top:32px;font-size:0.8rem;color:#484f58;text-align:center;">由 GitHub Actions 自动生成 · Run #{os.environ["CURRENT_RUN_NUMBER"]}</p>',
            '  </div>','</body>','</html>',
          ])
          (site / 'index.html').write_text(portal_html, encoding='utf-8')
          (site / '404.html').write_text(portal_html, encoding='utf-8')
          PY
          export SITE_DIR="$SITE_DIR"

          # 推送 gh-pages（最多重试 3 次）
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "单元测试报告 #${GITHUB_RUN_NUMBER} (${STATUS}: ${PASSED}/${TOTAL})" || echo "无变更"
          for attempt in 1 2 3; do
            if git push "$REPO_URL" HEAD:"$REPORTS_BRANCH" --force; then
              echo "gh-pages 推送成功（第 $attempt 次尝试）"
              break
            fi
            echo "push 第 $attempt 次失败，${attempt}0 秒后重试..."
            sleep $((attempt * 10))
          done

      - name: 上传测试产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ github.run_number }}
          path: ${{ runner.temp }}/unit-test.log
          if-no-files-found: warn
          retention-days: 7

      - name: Allure Report 摘要（PR 评论）
        if: always() && github.event_name == 'pull_request'
        uses: allure-framework/allure-report@v0
        with:
          report-directory: ${{ runner.temp }}/allure-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
