name: 单元测试（iMac）

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

concurrency:
  group: harmonyos-unit-test
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: write

env:
  REPORTS_BRANCH: "gh-pages"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  unit-test:
    name: 单元测试（iMac self-hosted）
    runs-on:
      - self-hosted
      - macOS
      - harmonyos-tv-test
    timeout-minutes: 20

    env:
      DEVECO_SDK_HOME: /Applications/DevEco-Studio.app/Contents/sdk
      OHOS_SDK_HOME: /Applications/DevEco-Studio.app/Contents/sdk/default/openharmony
      HARMONY_SDK_HOME: /Applications/DevEco-Studio.app/Contents/sdk/default/openharmony
      NODE_BIN: /Applications/DevEco-Studio.app/Contents/tools/node/bin/node
      HVIGOR_WRAPPER: /Applications/DevEco-Studio.app/Contents/tools/hvigor/bin/hvigorw.js
      OHPM_BIN: /Applications/DevEco-Studio.app/Contents/tools/ohpm/bin/ohpm
      WORK_DIR: /Users/shiningyao/DevecostudioProjects/vidall-tv

    steps:
      - name: 同步最新代码（git pull）
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          cd "$WORK_DIR"
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # macOS LibreSSL 下 GitHub HTTP/2 偶发 RPC 中断（curl 92 / early EOF），
          # 改用 HTTP/1.1 并带重试，避免瞬态网络错误导致 CI 假失败；
          # lowSpeed 限制让卡死的 fetch 在 ~20s 内快速失败，而不是挂满整段 job 时间预算。
          git config --global http.version HTTP/1.1
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 20
          FETCHED=false
          for attempt in 1 2 3; do
            if git fetch --no-tags "$REPO_URL" "$TARGET_SHA"; then
              echo "git fetch 成功（第 $attempt 次尝试）"
              FETCHED=true
              break
            fi
            echo "git fetch 第 $attempt 次失败，${attempt}0 秒后重试..."
            sleep $((attempt * 10))
          done
          if [ "$FETCHED" != "true" ]; then
            echo "错误：git fetch 重试 3 次仍失败"
            exit 1
          fi
          git checkout --force --detach FETCH_HEAD
          git clean -fdx
          echo "checked out sha: $(git rev-parse HEAD)"

      - name: 恢复 Harmony 依赖
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK_DIR"
          "$OHPM_BIN" install
          test -d "$WORK_DIR/oh_modules/@ibestservices/ibest-ui"

      - name: 编译单元测试（UnitTestBuild）
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          cd "$WORK_DIR"
          mkdir -p "$RUNNER_TEMP"
          "$NODE_BIN" "$HVIGOR_WRAPPER" \
            --mode module -p module=entry@default \
            UnitTestBuild --no-daemon \
            --analyze=normal --parallel --incremental \
            2>&1 | tee "$RUNNER_TEMP/unit-test-build.log"
          HVIGOR_EXIT=${PIPESTATUS[0]}
          if [ "$HVIGOR_EXIT" -ne 0 ]; then
            echo "错误：UnitTestBuild 编译失败（退出码 $HVIGOR_EXIT）"
            exit "$HVIGOR_EXIT"
          fi
          echo "UnitTestBuild 编译成功 ✅"

      - name: 执行设备端单测（test）
        shell: bash
        continue-on-error: true
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -eo pipefail
          cd "$WORK_DIR"

          # ── 彻底清理所有残留 hdc 进程 ──
          # 避免残留 daemon 与 hvigor test 内部启动的 hdc daemon 端口冲突导致卡死
          HDC_BIN="$OHOS_SDK_HOME/toolchains/hdc"
          "$HDC_BIN" kill 2>/dev/null || true
          sleep 1
          # 强制杀掉所有 hdc 相关进程（daemon 可能不响应 kill 命令）
          ps aux | grep -E '[h]dc' | awk '{print $2}' | xargs kill -9 2>/dev/null || true
          sleep 2

          # 验证设备可达（不启动长期 daemon）
          "$HDC_BIN" tconn 192.168.3.85:5555 2>/dev/null || true
          sleep 2
          TARGETS=$("$HDC_BIN" list targets 2>&1 || echo "")
          if ! echo "$TARGETS" | grep -q "192.168.3.85"; then
            echo "⚠️ 设备未连接，跳过设备端测试"
            exit 0
          fi
          echo "设备已连接: $TARGETS"

          # 关键：不要在这里 kill hdc daemon。电视是 TCP 设备（tconn 192.168.3.85:5555），
          # tconn 状态只存在于当前 daemon 内存中；一旦 kill，hvigor test 内部新起的 daemon
          # 不会重新 tconn，导致「找不到设备 → test 卡死在 Darwin 之后」。上面已 kill 过残留
          # daemon 并重新 tconn，这个 daemon 是干净的，直接留给 hvigor test 用即可。

          # 执行设备端测试，带超时保护
          RESULT_TXT="$WORK_DIR/entry/.test/default/intermediates/test/coverage_data/test_result.txt"
          UNIT_TEST_LOG="$RUNNER_TEMP/unit-test.log"
          # 单次启动并直接重定向到日志文件（不用 tee），使 $! 指向 hvigor 真实进程，
          # 从而能正确采集退出码并做超时终止；macOS 无 setsid，改用 kill + pgrep 递归清理进程树。
          # 与 UnitTestBuild 步骤保持一致加 --incremental --parallel：否则 `test` 会忽略上一步的
          # 增量缓存做全量重建（native C++ + 全量 ArkTS），在 CI 冷缓存机器上远超 480s。
          "$NODE_BIN" "$HVIGOR_WRAPPER" \
            --mode module -p module=entry@default \
            test --no-daemon -p coverage=true \
            --analyze=normal --parallel --incremental \
            > "$UNIT_TEST_LOG" 2>&1 &
          TEST_PID=$!
          # 真机用例实测 ~18-40s（UnitTestArkTS ~37s + 部署 + 跑用例）。若 hvigor test 找不到设备
          # 会回退本地 Previewer 永久卡死，等 480s 纯属浪费；90s 足以覆盖正常完成，卡死时快速止损。
          # job 仍有 timeout-minutes: 20 兜底。
          MAX_WAIT=90
          ELAPSED=0
          while kill -0 "$TEST_PID" 2>/dev/null && [ "$ELAPSED" -lt "$MAX_WAIT" ]; do
            sleep 5
            ELAPSED=$((ELAPSED + 5))
            # 每 30s 打印一次进度与 hvigor test 日志尾部：`test` 输出重定向到文件后，
            # 前台静默会让 UI 误判为卡死；这里直接透出当前卡在哪个阶段（构建/部署/跑用例）。
            if [ $((ELAPSED % 30)) -eq 0 ]; then
              echo "⏳ 设备端测试已等待 ${ELAPSED}s / ${MAX_WAIT}s"
              tail -n 3 "$UNIT_TEST_LOG" 2>/dev/null || true
            fi
          done
          # 递归收集指定 PID 的全部后代（后序遍历：最深后代先输出）。
          # 必须先收集再杀：若先杀父进程，macOS 会把其后代重托管给 launchd，pgrep -P 就再也找不到它们。
          collect_descendants() {
            local pid="$1" child
            for child in $(pgrep -P "$pid" 2>/dev/null || true); do
              collect_descendants "$child"
              printf '%s\n' "$child"
            done
          }

          if kill -0 "$TEST_PID" 2>/dev/null; then
            echo "⚠️ 设备端测试超时（${MAX_WAIT}s），终止进程树"
            DESC_PIDS=$(collect_descendants "$TEST_PID")
            # 先 SIGTERM：从最深后代 → 父进程，等待 5 秒
            for pid in $DESC_PIDS; do kill "$pid" 2>/dev/null || true; done
            kill "$TEST_PID" 2>/dev/null || true
            sleep 5
            # 再 SIGKILL：从最深后代 → 父进程
            for pid in $DESC_PIDS; do kill -9 "$pid" 2>/dev/null || true; done
            kill -9 "$TEST_PID" 2>/dev/null || true
            wait "$TEST_PID" 2>/dev/null || true
            # 清理可能残留的卡死 hdc 进程
            ps aux | grep -E '[h]dc' | awk '{print $2}' | xargs kill -9 2>/dev/null || true
            echo "⚠️ 设备端测试未在规定时间内完成，但不阻塞 CI"
            exit 0
          fi
          # 注意：不能用 `wait ... || true`，否则 `$?` 恒为 0，hvigor 真实退出码被吞掉
          set +e
          wait "$TEST_PID"
          HVIGOR_EXIT=$?
          set -e

          if [ "$HVIGOR_EXIT" -ne 0 ]; then
            # 防御性检测（issue #262 曾在部分环境出现）：@ohos/hypium 与字节码 HAR 的归一化 OhmUrl
            # 冲突会以「Failed to resolve OhmUrl（10311002）」呈现；命中即显式告警跳过，避免静默。
            if grep -qE 'Failed to resolve OhmUrl|10311002' "$UNIT_TEST_LOG"; then
              echo "::warning title=issue-262::设备端单测因 OhmUrl 归一化冲突被跳过（@ohos/hypium 与字节码 HAR 互斥），详见 issue #262"
              echo "⚠️ 检测到 OhmUrl 解析失败（issue #262），显式跳过设备端测试"
              exit 0
            fi
            echo "⚠️ hvigor test 退出码非零（$HVIGOR_EXIT），但不阻塞 CI"
            exit 0
          fi
          # 输出测试日志尾部便于排查
          tail -n 40 "$UNIT_TEST_LOG" || true

          if [ -f "$RESULT_TXT" ]; then
            TESTS_LINE=$(grep "Tests run:" "$RESULT_TXT" | tail -1 || true)
            TOTAL=$(echo "$TESTS_LINE" | grep -oE 'Tests run: [0-9]+' | grep -oE '[0-9]+' || echo "0")
            FAILED=$(echo "$TESTS_LINE" | grep -oE 'Failure: [0-9]+' | grep -oE '[0-9]+' || echo "0")
            echo "📊 设备端测试结果：$TESTS_LINE"
            if [ "$FAILED" != "0" ]; then
              echo "⚠️ 存在 $FAILED 个测试失败（不阻塞 CI，需后续修复）"
            else
              echo "✅ 所有测试通过"
            fi
          else
            echo "⚠️ test_result.txt 未找到"
          fi

      - name: 发布报告到 gh-pages
        if: always()
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          GH_TOKEN: ${{ github.token }}
          ALLURE_VERSION: "3.6.0"
        run: |
          set -euo pipefail
          REPORT_SRC="$WORK_DIR/entry/.test/default/outputs/test/reports"
          TEST_LOG="$RUNNER_TEMP/unit-test.log"
          SITE_DIR="$RUNNER_TEMP/gh-pages-site"
          ALLURE_RESULTS_DIR="$RUNNER_TEMP/allure-results"
          ALLURE_REPORT_DIR="$RUNNER_TEMP/allure-report"
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # 解析测试结果（优先从 test_result.txt 读取，其次从日志解析）
          RESULT_TXT="$WORK_DIR/entry/.test/default/intermediates/test/coverage_data/test_result.txt"
          BUILD_LOG="$RUNNER_TEMP/unit-test-build.log"
          if [ -f "$RESULT_TXT" ]; then
            TESTS_LINE=$(grep "Tests run:" "$RESULT_TXT" | tail -1)
            PASSED=$(echo "$TESTS_LINE" | grep -oE 'Pass: [0-9]+' | grep -oE '[0-9]+' || echo "0")
            FAILED=$(echo "$TESTS_LINE" | grep -oE 'Failure: [0-9]+' | grep -oE '[0-9]+' || echo "0")
            TOTAL=$(echo "$TESTS_LINE"  | grep -oE 'Tests run: [0-9]+' | grep -oE '[0-9]+' || echo "0")
          elif [ -f "$TEST_LOG" ]; then
            echo "警告：test_result.txt 未找到，回退到日志解析"
            TESTS_LINE=$(grep "Tests run:" "$TEST_LOG" 2>/dev/null | tail -1 || echo "")
            PASSED=$(echo "$TESTS_LINE" | grep -oE 'Pass: [0-9]+' | grep -oE '[0-9]+' || echo "0")
            FAILED=$(echo "$TESTS_LINE" | grep -oE 'Failure: [0-9]+' | grep -oE '[0-9]+' || echo "0")
            TOTAL=$(echo "$TESTS_LINE"  | grep -oE 'Tests run: [0-9]+' | grep -oE '[0-9]+' || echo "0")
          else
            echo "警告：test_result.txt 和日志均未找到，仅编译检查通过"
            PASSED=0; FAILED=0; TOTAL=0
          fi
          if [ "$FAILED" = "0" ] && [ "$TOTAL" != "0" ]; then STATUS="passed"
          elif [ "$FAILED" != "0" ] && [ "$TOTAL" != "0" ]; then STATUS="partial"
          elif [ "$TOTAL" = "0" ] && grep -q "BUILD SUCCESSFUL" "$BUILD_LOG" 2>/dev/null; then STATUS="build_only"
          else STATUS="failed"; fi

          # build_only 模式：从测试源目录统计编译通过的测试文件数作为补充信息
          COMPILED_COUNT=0
          if [ "$STATUS" = "build_only" ]; then
            COMPILED_COUNT=$(find "$WORK_DIR/entry/src/test" -name '*.test.ets' -type f 2>/dev/null | wc -l | awk '{print $1}')
            echo "📊 编译通过 ${COMPILED_COUNT} 个测试文件（设备端测试未执行）"
          fi
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # clone gh-pages（最多重试 3 次，规避 macOS LibreSSL 偶发 SSL 握手失败）
          rm -rf "$SITE_DIR"
          CLONED=false
          for attempt in 1 2 3; do
            if git clone --depth 1 --branch "$REPORTS_BRANCH" "$REPO_URL" "$SITE_DIR" 2>/dev/null; then
              echo "已加载现有 gh-pages 分支（第 $attempt 次尝试）"
              CLONED=true
              break
            fi
            echo "clone 第 $attempt 次失败，${attempt}0 秒后重试..."
            sleep $((attempt * 10))
          done
          if [ "$CLONED" = "false" ]; then
            echo "gh-pages 分支不存在，初始化新分支"
            mkdir -p "$SITE_DIR" && cd "$SITE_DIR"
            git init && git checkout -b "$REPORTS_BRANCH"
          fi
          cd "$SITE_DIR"
          touch .nojekyll

          # 确保 vendor 文件存在（首次部署或文件被意外删除时重新下载）
          mkdir -p vendor
          if [ ! -s vendor/tailwind.js ]; then
            echo "下载 tailwind.js..."
            curl -fsSL "https://cdn.tailwindcss.com/3.4.17" -o vendor/tailwind.js || \
            curl -fsSL "https://cdn.bootcdn.net/ajax/libs/tailwindcss/3.4.1/tailwind.min.js" -o vendor/tailwind.js
          fi
          if [ ! -s vendor/echarts.min.js ]; then
            echo "下载 echarts.min.js..."
            curl -fsSL "https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js" -o vendor/echarts.min.js || \
            curl -fsSL "https://cdn.bootcdn.net/ajax/libs/echarts/5.6.0/echarts.min.js" -o vendor/echarts.min.js
          fi

          # 写 unit-status.json
          cat > unit-status.json <<JSON
          {
            "status": "${STATUS}",
            "passed": ${PASSED},
            "failed": ${FAILED},
            "total": ${TOTAL},
            "compiled_count": ${COMPILED_COUNT},
            "run_number": "${GITHUB_RUN_NUMBER}",
            "timestamp": "${TIMESTAMP}",
            "run_url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          JSON

          # 生成 allure-results JSON（逐条解析 test_result.txt）
          mkdir -p "$ALLURE_RESULTS_DIR"
          export RESULT_TXT ALLURE_RESULTS_DIR GITHUB_RUN_NUMBER GITHUB_REPOSITORY GITHUB_RUN_ID
          python3 - <<'PY'
          import json, os, uuid
          from pathlib import Path
          from datetime import datetime, timezone
          result_txt  = Path(os.environ['RESULT_TXT'])
          allure_dir  = Path(os.environ['ALLURE_RESULTS_DIR'])
          run_number  = os.environ['GITHUB_RUN_NUMBER']
          repo        = os.environ['GITHUB_REPOSITORY']
          run_id      = os.environ['GITHUB_RUN_ID']
          now_ms      = int(datetime.now(timezone.utc).timestamp() * 1000)
          current_suite = 'unit'
          pending: dict = {}
          test_cases: list = []
          if result_txt.exists():
            for line in result_txt.read_text(encoding='utf-8').splitlines():
              if line.startswith('class='):
                current_suite = line[6:].strip()
              elif line.startswith('test='):
                pending = {'suite': current_suite, 'name': line[5:].strip(), 'status': 'broken'}
              elif line.startswith('result=') and pending:
                r = line[7:].strip()
                if r == 'Success':  pending['status'] = 'passed'
                elif r == 'Failure': pending['status'] = 'failed'
                else:                pending['status'] = 'broken'
                test_cases.append(pending)
                pending = {}
          for tc in test_cases:
            hid = f"{tc['suite']}#{tc['name']}"
            res: dict = {
              'uuid': str(uuid.uuid4()),
              'historyId': hid, 'testCaseId': hid,
              'name': tc['name'],
              'fullName': f"{tc['suite']}#{tc['name']}",
              'status': tc['status'],
              'stage': 'finished',
              'start': now_ms, 'stop': now_ms,
              'labels': [
                {'name': 'suite',      'value': tc['suite']},
                {'name': 'framework',  'value': 'hvigorw / hypium'},
                {'name': 'host',       'value': 'iMac self-hosted runner'},
              ],
              'links': [
                {'name': f'Actions #{run_number}',
                 'url':  f'https://github.com/{repo}/actions/runs/{run_id}',
                 'type': 'link'},
              ],
            }
            (allure_dir / f"{res['uuid']}-result.json").write_text(
              json.dumps(res, ensure_ascii=False), encoding='utf-8')
          print(f"已生成 {len(test_cases)} 条 allure-results JSON")
          PY

          # 复制 Allure history（Allure 3 格式；跳过旧 Allure 2 history 避免不兼容）
          # Allure 3 history 文件包含 history-trend.json，Allure 2 格式不含此文件
          if [[ -d "$SITE_DIR/unit/history" ]] && [[ -f "$SITE_DIR/unit/history/history-trend.json" ]]; then
            echo "复制 Allure 3 历史 trend 数据..."
            cp -R "$SITE_DIR/unit/history" "$ALLURE_RESULTS_DIR/history"
          else
            echo "未找到 Allure 3 兼容 history，从本次开始建立新趋势图"
            # 清除旧 Allure 2 history，避免污染
            rm -rf "$SITE_DIR/unit/history"
          fi

          # 生成 Allure 3 HTML 报告
          echo "生成 Allure 3 HTML 报告（allure@${ALLURE_VERSION}）..."
          rm -rf "$ALLURE_REPORT_DIR"
          npx --yes "allure@${ALLURE_VERSION}" generate "$ALLURE_RESULTS_DIR" --output "$ALLURE_REPORT_DIR"

          # 复制 Allure 报告到 unit/runs/run-N/
          RUN_REPORT_DIR="unit/runs/run-${GITHUB_RUN_NUMBER}"
          mkdir -p "$RUN_REPORT_DIR"
          cp -R "$ALLURE_REPORT_DIR/." "$RUN_REPORT_DIR/"
          echo "Allure 报告已复制到 $RUN_REPORT_DIR"

          # 覆盖率报告放 unit/runs/run-N/coverage/detail/（保留行级详情）
          if [ -d "$REPORT_SRC" ]; then
            mkdir -p "$RUN_REPORT_DIR/coverage/detail"
            cp -r "$REPORT_SRC/." "$RUN_REPORT_DIR/coverage/detail/"
            echo "覆盖率报告已复制到 $RUN_REPORT_DIR/coverage/detail/"
          fi

          # 写入 unit-history.json、coverage-history.json，并生成覆盖率汇总页
          export SITE_DIR RUN_NUMBER="${GITHUB_RUN_NUMBER}" RUN_STATUS="${STATUS}" \
            RUN_PASSED="${PASSED}" RUN_FAILED="${FAILED}" RUN_TOTAL="${TOTAL}" \
            RUN_TIMESTAMP="${TIMESTAMP}" RUN_REPORT_DIR_ENV="${RUN_REPORT_DIR}" \
            COMPILED_COUNT="${COMPILED_COUNT}"
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          site        = Path(os.environ['SITE_DIR'])
          run_number  = int(os.environ['RUN_NUMBER'])
          run_status  = os.environ['RUN_STATUS']
          run_passed  = int(os.environ['RUN_PASSED'])
          run_failed  = int(os.environ['RUN_FAILED'])
          run_total   = int(os.environ['RUN_TOTAL'])
          run_ts      = os.environ['RUN_TIMESTAMP']
          run_dir     = site / os.environ['RUN_REPORT_DIR_ENV']
          cov_dir     = run_dir / 'coverage'

          # ─── 1. 从 hvigor coverageReport.json 生成汇总数据 ─────────────────────────
          # hvigor test -p coverage=true 生成的是 coverageReport.json（非 Istanbul coverage-summary.json）
          cov_report = None
          cov_report_src = cov_dir / 'detail' / 'coverageReport.json'
          if cov_report_src.exists():
              try:
                  raw     = json.loads(cov_report_src.read_text(encoding='utf-8'))
                  summary = raw.get('summary', {})
                  files   = []
                  for f in raw.get('files', []):
                      fp    = f.get('path', '')
                      parts = fp.replace('\\', '/').split('/')
                      short = '/'.join(parts[-2:]) if len(parts) >= 2 else fp
                      fs    = f.get('summary', {})
                      file_item: dict = {'path': short, 'summary': {
                          'lines':     fs.get('lines', {}),
                          'functions': fs.get('functions', {}),
                          'branches':  fs.get('branches', {}),
                      }}
                      files.append(file_item)
                  cov_report = {'summary': summary, 'files': files}
                  cov_dir.mkdir(parents=True, exist_ok=True)
                  (cov_dir / 'coverageReport.json').write_text(
                      json.dumps(cov_report, ensure_ascii=False, indent=2), encoding='utf-8')
                  print(f'coverageReport.json 已生成（{len(files)} 个文件）')
              except Exception as e:
                  print(f'coverageReport.json 生成失败: {e}')

          # ─── 2. 更新 unit-history.json ───────────────────────────────────────────
          hist_path = site / 'unit' / 'unit-history.json'
          try:
              history = json.loads(hist_path.read_text(encoding='utf-8')) if hist_path.exists() else []
          except Exception:
              history = []
          entry: dict = {
              'run_number':  run_number,
              'timestamp':   run_ts,
              'status':      'pass' if run_status in ('passed', 'build_only') else 'fail',
              'passed':      run_passed,
              'failed':      run_failed,
