name: Ubuntu SDK 兜底检查（手动）

env:
  OHOS_SDK_URL: https://repo.huaweicloud.com/harmonyos/os/5.1.0-Release/ohos-sdk-windows_linux-public.tar.gz
  OHOS_SDK_API_DIR: "18"
  CI_COMPILE_SDK_VERSION: "5.1.0(18)"
  CI_RUNTIME_OS: OpenHarmony
  HVIGOR_NPM_REGISTRY: https://repo.harmonyos.com/npm/
  HVIGOR_VERSION: "6.22.3"
  NODE_VERSION: "20"

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  ubuntu-sdk-build-check:
    name: UnitTestBuild（Ubuntu 公共 SDK）
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore OHOS SDK Cache
        id: cache-sdk-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ohos-sdk
          key: ohos-sdk-linux-${{ env.OHOS_SDK_API_DIR }}-v2
          restore-keys: |
            ohos-sdk-linux-${{ env.OHOS_SDK_API_DIR }}-

      - name: Download and Extract OHOS SDK
        if: steps.cache-sdk-restore.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/ohos-sdk"
          cd "${{ runner.temp }}"

          CANDIDATE_SDKS=(
            "${OHOS_SDK_URL}|5.1.0(18)|18"
            "https://repo.huaweicloud.com/harmonyos/os/5.0.3-Release/ohos-sdk-windows_linux-public.tar.gz|5.0.3(18)|18"
            "https://repo.huaweicloud.com/harmonyos/os/5.0.0-Release/ohos-sdk-windows_linux-public.tar.gz|5.0.0(18)|18"
          )

          DOWNLOADED=0
          for candidate in "${CANDIDATE_SDKS[@]}"; do
            IFS='|' read -r url sdk_version api_dir <<< "$candidate"
            echo "Try download SDK from: $url"

            if ! wget -q -O sdk.tar.gz "$url"; then
              echo "Download failed for: $url"
              continue
            fi

            if ! wget -q -O sdk.tar.gz.sha256 "${url}.sha256"; then
              echo "Checksum file missing for: $url"
              rm -f sdk.tar.gz sdk.tar.gz.sha256
              continue
            fi

            expected_sha=$(awk '{print $1}' sdk.tar.gz.sha256 | tr -d '\r')
            actual_sha=$(shasum -a 256 sdk.tar.gz | awk '{print $1}')
            if [[ -z "$expected_sha" || "$actual_sha" != "$expected_sha" ]]; then
              echo "Checksum verify failed for: $url"
              rm -f sdk.tar.gz sdk.tar.gz.sha256
              continue
            fi

            DOWNLOADED=1
            echo "Downloaded SDK from: $url"
            echo "CI_COMPILE_SDK_VERSION=$sdk_version" >> "$GITHUB_ENV"
            echo "OHOS_SDK_API_DIR=$api_dir" >> "$GITHUB_ENV"
            break
          done

          if [[ "$DOWNLOADED" -ne 1 ]]; then
            echo "Failed to download OHOS SDK from all candidate URLs"
            exit 1
          fi

          tar -xzf sdk.tar.gz -C ohos-sdk/

          LINUX_DIR=$(find ohos-sdk -type d -name "linux" | head -1)
          if [[ -z "$LINUX_DIR" ]]; then
            echo "linux directory not found in SDK archive"
            find ohos-sdk -maxdepth 4 -type d | head -40
            exit 1
          fi
          echo "Detected SDK linux dir: $LINUX_DIR"

          if [[ "$LINUX_DIR" != "ohos-sdk/linux" ]]; then
            rm -rf ohos-sdk/linux || true
            ln -s "$(realpath "$LINUX_DIR")" ohos-sdk/linux
          fi

          ZIP_LIST=$(find -L ohos-sdk/linux -type f -name "*-linux-*.zip" | tr '\n' ' ')
          if [[ -z "$ZIP_LIST" ]]; then
            ZIP_LIST=$(find -L ohos-sdk/linux -type f -name "*.zip" | tr '\n' ' ')
          fi

          if [[ -z "$ZIP_LIST" ]]; then
            echo "No SDK component zip found under linux directory"
            find -L ohos-sdk/linux -maxdepth 4 -type f | head -80
            exit 1
          fi

          for zip_file in $ZIP_LIST; do
            echo "Extract SDK component: $zip_file"
            unzip -q -o "$zip_file" -d ohos-sdk/linux/
          done

          test -d "ohos-sdk/linux/native"
          test -d "ohos-sdk/linux/toolchains"
          test -d "ohos-sdk/linux/ets"

      - name: Save OHOS SDK Cache
        if: success() && steps.cache-sdk-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ohos-sdk
          key: ohos-sdk-linux-${{ env.OHOS_SDK_API_DIR }}-v2

      - name: Prepare Environment
        shell: bash
        run: |
          set -euo pipefail
          CI_SDK_ROOT="${{ runner.temp }}/ci-sdk"

          mkdir -p "$CI_SDK_ROOT/${OHOS_SDK_API_DIR}"
          for component in ets native toolchains; do
            ln -sfn "$(realpath "${{ runner.temp }}/ohos-sdk/linux/$component")" "$CI_SDK_ROOT/${OHOS_SDK_API_DIR}/$component"
          done
          for optional_component in js previewer; do
            if [[ -d "${{ runner.temp }}/ohos-sdk/linux/$optional_component" ]]; then
              ln -sfn "$(realpath "${{ runner.temp }}/ohos-sdk/linux/$optional_component")" "$CI_SDK_ROOT/${OHOS_SDK_API_DIR}/$optional_component"
            fi
          done

          echo "DEVECO_SDK_HOME=$CI_SDK_ROOT" >> "$GITHUB_ENV"
          echo "OHOS_BASE_SDK_HOME=$CI_SDK_ROOT" >> "$GITHUB_ENV"
          echo "OHOS_SDK_HOME=$CI_SDK_ROOT/${OHOS_SDK_API_DIR}" >> "$GITHUB_ENV"
          echo "HARMONY_SDK_HOME=$CI_SDK_ROOT/${OHOS_SDK_API_DIR}" >> "$GITHUB_ENV"

          printf 'sdk.dir=%s\n' "$CI_SDK_ROOT" > "$GITHUB_WORKSPACE/local.properties"

          python3 - <<'PY'
          import os
          from pathlib import Path

          ci_sdk = os.environ['CI_COMPILE_SDK_VERSION']
          ci_runtime = os.environ['CI_RUNTIME_OS']
          p = Path('build-profile.json5')
          s = p.read_text()
          s = s.replace('"targetSdkVersion": "6.0.2(22)"', f'"targetSdkVersion": "{ci_sdk}",\n        "compileSdkVersion": "{ci_sdk}"')
          s = s.replace('"compatibleSdkVersion": "5.1.1(19)"', f'"compatibleSdkVersion": "{ci_sdk}"')
          s = s.replace('"runtimeOS": "HarmonyOS"', f'"runtimeOS": "{ci_runtime}"')
          p.write_text(s)
          PY

          grep -n "targetSdkVersion\|compileSdkVersion\|compatibleSdkVersion\|runtimeOS" build-profile.json5
          cat "$GITHUB_WORKSPACE/local.properties"

      - name: Install Hvigor Toolchain
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          npm install --no-save --registry "$HVIGOR_NPM_REGISTRY" \
            "@ohos/hvigor@$HVIGOR_VERSION" \
            "@ohos/hvigor-ohos-plugin@$HVIGOR_VERSION"
          HVIGOR_ENTRY="$GITHUB_WORKSPACE/node_modules/@ohos/hvigor/bin/hvigor.js"
          test -f "$HVIGOR_ENTRY"
          echo "HVIGOR_ENTRY=$HVIGOR_ENTRY" >> "$GITHUB_ENV"

      - name: Restore Harmony Dependency Cache
        id: cache-ohpm-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ci/ohpm-cache
          key: ohpm-cache-${{ runner.os }}-${{ hashFiles('oh-package-lock.json5') }}

      - name: Restore Harmony Dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import json
          import shutil
          import tarfile
          import time
          import urllib.request
          from pathlib import Path
          from urllib.error import HTTPError, URLError

          def download_with_retry(url: str, archive_path: Path) -> None:
            last_error = None
            for attempt in range(1, 6):
              try:
                print(f'Downloading {url} (attempt {attempt}/5)')
                with urllib.request.urlopen(url, timeout=90) as response:
                  archive_path.write_bytes(response.read())
                if archive_path.exists() and archive_path.stat().st_size > 0:
                  return
              except (HTTPError, URLError, TimeoutError, ConnectionResetError) as err:
                last_error = err
                if archive_path.exists():
                  archive_path.unlink()
                print(f'Download failed: {err}')
                if attempt < 5:
                  time.sleep(attempt * 5)
            raise RuntimeError(f'Failed to download {url}: {last_error}')

          def safe_extract_archive(archive_path: Path, dest_dir: Path) -> None:
            root = dest_dir.resolve()
            with tarfile.open(archive_path, 'r:gz') as tar:
              for member in tar.getmembers():
                member_path = Path(member.name)
                if member.issym() or member.islnk() or member_path.is_absolute() or '..' in member_path.parts:
                  raise RuntimeError(f'Unsafe archive member: {member.name}')
                target_path = (root / member.name).resolve()
                try:
                  target_path.relative_to(root)
                except ValueError as err:
                  raise RuntimeError(f'Unsafe archive member: {member.name}') from err
                if member.isdir():
                  target_path.mkdir(parents=True, exist_ok=True)
                  continue
                if not member.isfile():
                  continue
                target_path.parent.mkdir(parents=True, exist_ok=True)
                source = tar.extractfile(member)
                if source is None:
                  continue
                with source, open(target_path, 'wb') as out_file:
                  shutil.copyfileobj(source, out_file)

          root = Path('.')
          lock_path = root / 'oh-package-lock.json5'
          lock = json.loads(lock_path.read_text())
          packages = lock.get('packages', {})
          specifiers = lock.get('specifiers', {})

          oh_modules_dir = root / 'oh_modules'
          cache_dir = root / '.ci' / 'ohpm-cache'
          extract_dir = cache_dir / 'extract'
          oh_modules_dir.mkdir(parents=True, exist_ok=True)
          cache_dir.mkdir(parents=True, exist_ok=True)
          extract_dir.mkdir(parents=True, exist_ok=True)

          for resolved_key in specifiers.values():
            package_meta = packages.get(resolved_key)
            if not package_meta:
              continue
            package_name = package_meta.get('name', '')
            resolved = package_meta.get('resolved', '')
            if len(package_name) == 0 or not resolved.endswith('.har'):
              continue

            if resolved.startswith('http://') or resolved.startswith('https://'):
              archive_name = resolved.split('/')[-1]
              archive_path = cache_dir / archive_name
              if not archive_path.exists():
                print(f'Preparing to download {package_name} from {resolved}')
                download_with_retry(resolved, archive_path)
              else:
                print(f'Using cached archive for {package_name}: {archive_path}')
            else:
              archive_path = (root / resolved).resolve()
              print(f'Using local archive for {package_name}: {archive_path}')

            if not archive_path.exists():
              raise FileNotFoundError(f'Archive not found for {package_name}: {archive_path}')

            safe_name = package_name.replace('/', '__').replace('@', '')
            package_extract_dir = extract_dir / safe_name
            if package_extract_dir.exists():
              shutil.rmtree(package_extract_dir)
            package_extract_dir.mkdir(parents=True, exist_ok=True)

            safe_extract_archive(archive_path, package_extract_dir)

            source_dir = package_extract_dir / 'package'
            if not source_dir.exists():
              raise FileNotFoundError(f'Extracted package dir missing for {package_name}')

            dest_dir = oh_modules_dir / package_name
            dest_dir.parent.mkdir(parents=True, exist_ok=True)
            if dest_dir.exists():
              shutil.rmtree(dest_dir)
            shutil.copytree(source_dir, dest_dir)
            print(f'Restored {package_name} -> {dest_dir}')
          PY
          test -d "$GITHUB_WORKSPACE/oh_modules/@ibestservices/ibest-ui"

      - name: Save Harmony Dependency Cache
        if: success() && steps.cache-ohpm-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ci/ohpm-cache
          key: ohpm-cache-${{ runner.os }}-${{ hashFiles('oh-package-lock.json5') }}

      - name: Sync Project
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE/.ci/logs"
          set -o pipefail
          node "$HVIGOR_ENTRY" \
          --sync -p product=default --analyze=normal --parallel --incremental --daemon \
          2>&1 | tee "$GITHUB_WORKSPACE/.ci/logs/sync-project.log"
          exit ${PIPESTATUS[0]}

      - name: Prepare Unit Test Page Template
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path

          page = Path('entry/.test/testability/pages/Index.ets')
          page.parent.mkdir(parents=True, exist_ok=True)
          page.write_text(
              "@Entry\n"
              "@Component\n"
              "struct Index {\n"
              "  build() {\n"
              "    Column() {\n"
              "      Text('Unit Test Entry')\n"
              "    }\n"
              "    .width('100%')\n"
              "    .height('100%')\n"
              "  }\n"
              "}\n"
          )
          print(f'Prepared {page}')
          PY
          test -f "$GITHUB_WORKSPACE/entry/.test/testability/pages/Index.ets"

      - name: UnitTestBuild（Ubuntu SDK 兜底）
        shell: bash
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE/.ci/logs"
          node "$HVIGOR_ENTRY" \
          --mode module -p module=entry@default \
          -p unit.test.replace.page=../../../.test/testability/pages/Index \
          -p product=default -p pageType=page -p isLocalTest=true -p unitTestMode=true \
          -p buildRoot=.test UnitTestBuild --analyze=normal --parallel --incremental --daemon \
          2>&1 | tee "$GITHUB_WORKSPACE/.ci/logs/unit-test-build.log"
          exit ${PIPESTATUS[0]}

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-sdk-check-logs-${{ github.run_number }}
          path: ${{ github.workspace }}/.ci/logs/**
          if-no-files-found: warn
          retention-days: 7
