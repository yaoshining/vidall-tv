name: 集成测试

on:
  workflow_dispatch:
    inputs:
      deviceSerial:
        description: 指定设备序列号；留空则自动选择首个在线设备
        required: false
        type: string
      logLevel:
        description: hilog 日志级别
        required: true
        default: I
        type: choice
        options:
          - D
          - I
          - W
          - E
      runnerLabel:
        description: 指定测试机 runner 标签
        required: true
        default: harmonyos-tv-test
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: harmonyos-device-integration-test
  cancel-in-progress: false

jobs:
  integration-test:
    name: Build and run on self-hosted device
    runs-on:
      - self-hosted
      - macOS
      - ${{ inputs.runnerLabel }}
    timeout-minutes: 45

    env:
      DEVECO_SDK_HOME: /Applications/DevEco-Studio.app/Contents/sdk
      OHOS_SDK_HOME: /Applications/DevEco-Studio.app/Contents/sdk/default/openharmony
      HARMONY_SDK_HOME: /Applications/DevEco-Studio.app/Contents/sdk/default/openharmony
      NODE_BIN: /Applications/DevEco-Studio.app/Contents/tools/node/bin/node
      HVIGOR_WRAPPER: /Applications/DevEco-Studio.app/Contents/tools/hvigor/bin/hvigorw.js
      HDC_BIN: /Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/toolchains/hdc
      BUNDLE_NAME: com.yao.vidalltv
      TEST_MODULE: entry_test
      JAVA_HOME: /Applications/DevEco-Studio.app/Contents/jbr/Contents/Home

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore signing certificates
        shell: bash
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          SIGNING_PROFILE_BASE64: ${{ secrets.SIGNING_PROFILE_BASE64 }}
          SIGNING_MATERIAL_BASE64: ${{ secrets.SIGNING_MATERIAL_BASE64 }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          # 证书写入 runner 可写目录，同时还原 material/ 目录，再 patch build-profile.json5 的路径
          python3 - <<'PY'
          import re, json, base64, os, sys, tarfile, io
          from pathlib import Path

          cert_dir = Path(os.environ['RUNNER_TEMP']) / 'signing'
          cert_dir.mkdir(parents=True, exist_ok=True)

          secrets = {
              'certpath':  ('SIGNING_CERT_BASE64',    'default.cer'),
              'storeFile': ('SIGNING_P12_BASE64',     'default.p12'),
              'profile':   ('SIGNING_PROFILE_BASE64', 'default.p7b'),
          }

          missing_secrets = []
          new_paths = {}
          for key, (env_var, filename) in secrets.items():
              b64 = os.environ.get(env_var, '').strip()
              if not b64:
                  missing_secrets.append(env_var)
                  continue
              dest = cert_dir / filename
              dest.write_bytes(base64.b64decode(b64))
              dest.chmod(0o600)
              new_paths[key] = str(dest)
              print(f'还原证书: {key} -> {dest}')

          # 还原 material/ 目录（hvigor 签名工具必需）
          material_b64 = os.environ.get('SIGNING_MATERIAL_BASE64', '').strip()
          if material_b64:
              tar_bytes = base64.b64decode(material_b64)
              with tarfile.open(fileobj=io.BytesIO(tar_bytes), mode='r:gz') as tf:
                  tf.extractall(cert_dir)
              print(f'还原 material 目录 -> {cert_dir}/material')
          else:
              missing_secrets.append('SIGNING_MATERIAL_BASE64')

          if missing_secrets:
              print(f'WARNING: 以下 Secret 未配置，跳过还原: {missing_secrets}')
              print('若签名证书已预装在 runner 上，可忽略此警告')
              sys.exit(0)

          # 将 build-profile.json5 中 default signing config 的路径替换为新路径
          bp_path = Path('build-profile.json5')
          content = bp_path.read_text(encoding='utf-8')
          for key, new_path in new_paths.items():
              content = re.sub(
                  rf'("{key}"\s*:\s*)"[^"]*"',
                  rf'\1"{new_path}"',
                  content
              )
          bp_path.write_text(content, encoding='utf-8')
          print('build-profile.json5 证书路径已更新')
          PY

      - name: Verify self-hosted runner environment
        shell: bash
        run: |
          set -euo pipefail
          test -x "$NODE_BIN"
          test -f "$HVIGOR_WRAPPER"
          test -x "$HDC_BIN"
          test -d "$OHOS_SDK_HOME/toolchains"

          # 校验 default signing config 证书文件是否存在
          python3 - <<'PY'
          import re, json, sys
          from pathlib import Path

          content = Path('build-profile.json5').read_text(encoding='utf-8')
          content = re.sub(r',(\s*[}\]])', r'\1', content)
          content = re.sub(r'//[^\n]*', '', content)
          data = json.loads(content)

          signing_configs = data['app']['signingConfigs']
          default_config = next((c for c in signing_configs if c['name'] == 'default'), None)
          if not default_config:
              print('ERROR: No default signing config found in build-profile.json5', file=sys.stderr)
              sys.exit(1)

          material = default_config['material']
          missing = []
          for key in ['certpath', 'storeFile', 'profile']:
              path = material.get(key, '')
              if not path or not Path(path).exists():
                  missing.append(f'{key}: {path}')

          if missing:
              print('ERROR: 以下签名证书文件缺失（请配置 SIGNING_CERT_BASE64 / SIGNING_P12_BASE64 / SIGNING_PROFILE_BASE64 Secrets，或将证书预装到 runner）:', file=sys.stderr)
              for m in missing:
                  print(f'  {m}', file=sys.stderr)
              sys.exit(1)

          print('签名证书文件校验通过')
          PY

          printf 'sdk.dir=%s\n' "$DEVECO_SDK_HOME" > "$GITHUB_WORKSPACE/local.properties"
          mkdir -p "$GITHUB_WORKSPACE/.ci/integration"

          {
            echo "## 集成测试环境"
            echo "- Runner: $RUNNER_NAME"
            echo "- Required Label: ${{ inputs.runnerLabel }}"
            echo "- Workspace: $GITHUB_WORKSPACE"
            echo "- SDK: $OHOS_SDK_HOME"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore Harmony dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import json
          import shutil
          import ssl
          import tarfile
          import time
          import urllib.request
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlparse

          def download_with_retry(url: str, archive_path: Path) -> None:
            last_error = None
            parsed = urlparse(url)
            ssl_context = None
            if parsed.netloc.endswith('repo.harmonyos.com'):
              ssl_context = ssl._create_unverified_context()
              print(f'Use relaxed SSL context for {parsed.netloc}')

            for attempt in range(1, 6):
              try:
                print(f'Downloading {url} (attempt {attempt}/5)')
                with urllib.request.urlopen(url, timeout=90, context=ssl_context) as response:
                  archive_path.write_bytes(response.read())
                if archive_path.exists() and archive_path.stat().st_size > 0:
                  return
              except (HTTPError, URLError, TimeoutError, ConnectionResetError, ssl.SSLError) as err:
                last_error = err
                if archive_path.exists():
                  archive_path.unlink()
                print(f'Download failed: {err}')
                if attempt < 5:
                  time.sleep(attempt * 5)
            raise RuntimeError(f'Failed to download {url}: {last_error}')

          def safe_extract_archive(archive_path: Path, dest_dir: Path) -> None:
            root = dest_dir.resolve()
            with tarfile.open(archive_path, 'r:gz') as tar:
              for member in tar.getmembers():
                member_path = Path(member.name)
                if member.issym() or member.islnk() or member_path.is_absolute() or '..' in member_path.parts:
                  raise RuntimeError(f'Unsafe archive member: {member.name}')

                target_path = (root / member.name).resolve()
                try:
                  target_path.relative_to(root)
                except ValueError as err:
                  raise RuntimeError(f'Unsafe archive member: {member.name}') from err

                if member.isdir():
                  target_path.mkdir(parents=True, exist_ok=True)
                  continue

                if not member.isfile():
                  continue

                target_path.parent.mkdir(parents=True, exist_ok=True)
                source = tar.extractfile(member)
                if source is None:
                  continue
                with source, open(target_path, 'wb') as out_file:
                  shutil.copyfileobj(source, out_file)

          root = Path('.')
          lock = json.loads((root / 'oh-package-lock.json5').read_text(encoding='utf-8'))
          packages = lock.get('packages', {})
          specifiers = lock.get('specifiers', {})

          oh_modules_dir = root / 'oh_modules'
          cache_dir = Path.home() / '.vidall-ohpm-cache'
          extract_dir = cache_dir / 'extract'
          oh_modules_dir.mkdir(parents=True, exist_ok=True)
          cache_dir.mkdir(parents=True, exist_ok=True)
          extract_dir.mkdir(parents=True, exist_ok=True)

          for resolved_key in specifiers.values():
            package_meta = packages.get(resolved_key)
            if not package_meta:
              continue
            package_name = package_meta.get('name', '')
            resolved = package_meta.get('resolved', '')
            if len(package_name) == 0 or not resolved.endswith('.har'):
              continue

            if resolved.startswith('http://') or resolved.startswith('https://'):
              archive_name = resolved.split('/')[-1]
              archive_path = cache_dir / archive_name
              if not archive_path.exists():
                download_with_retry(resolved, archive_path)
            else:
              archive_path = (root / resolved).resolve()

            if not archive_path.exists():
              raise FileNotFoundError(f'Archive not found for {package_name}: {archive_path}')

            target_dir = oh_modules_dir / package_name
            temp_dir = extract_dir / package_name.replace('/', '__')
            if target_dir.exists():
              shutil.rmtree(target_dir)
            if temp_dir.exists():
              shutil.rmtree(temp_dir)
            temp_dir.mkdir(parents=True, exist_ok=True)

            safe_extract_archive(archive_path, temp_dir)
            source_dir = temp_dir / 'package'
            if not source_dir.exists():
              source_dir = temp_dir
            shutil.copytree(source_dir, target_dir)
            print(f'Restored {package_name} -> {target_dir}')
          PY

          find "$GITHUB_WORKSPACE/oh_modules" -maxdepth 2 -mindepth 1 | head -50

      - name: Detect target device
        shell: bash
        env:
          DEVICE_IP: ${{ secrets.DEVICE_IP }}
        run: |
          set -euo pipefail
          LOG_DIR="$GITHUB_WORKSPACE/.ci/integration"

          # 启动 hdc 服务端（幂等：已运行时无副作用）
          "$HDC_BIN" start || true
          sleep 2

          # 通过 TCP/IP 连接设备（连接在 hdc server 重启后会丢失，每次需重建）
          if [[ -n "${DEVICE_IP:-}" ]]; then
            echo "尝试 tconn: ${DEVICE_IP}:5555"
            "$HDC_BIN" tconn "${DEVICE_IP}:5555" || true
            sleep 2
          fi

          "$HDC_BIN" list targets | tee "$LOG_DIR/hdc-targets.log"

          TARGET_INPUT='${{ inputs.deviceSerial }}'
          # 过滤掉 hdc 的占位行（[Empty]、空行），只保留真实设备串号
          AVAILABLE_TARGETS=$("$HDC_BIN" list targets | grep -v '^\[' | awk 'NF {print $1}')
          if [[ -z "$AVAILABLE_TARGETS" ]]; then
            echo "未检测到可用 HarmonyOS TV 真机，请先连接测试设备。"
            exit 1
          fi

          if [[ -n "$TARGET_INPUT" ]]; then
            if ! printf '%s\n' "$AVAILABLE_TARGETS" | grep -Fxq "$TARGET_INPUT"; then
              echo "指定设备不在线: $TARGET_INPUT"
              exit 1
            fi
            DEVICE_SERIAL="$TARGET_INPUT"
          else
            DEVICE_SERIAL=$(printf '%s\n' "$AVAILABLE_TARGETS" | head -n 1)
          fi

          echo "DEVICE_SERIAL=$DEVICE_SERIAL" >> "$GITHUB_ENV"
          echo "- Device: $DEVICE_SERIAL" >> "$GITHUB_STEP_SUMMARY"

      - name: Sync project
        shell: bash
        run: |
          set -o pipefail
          LOG_DIR="$GITHUB_WORKSPACE/.ci/integration"

          "$NODE_BIN" "$HVIGOR_WRAPPER" \
            --sync \
            -p product=default \
            --analyze=normal \
            --parallel \
            --incremental \
            --no-daemon 2>&1 | tee "$LOG_DIR/sync-project.log"

          STATUS=${PIPESTATUS[0]}
          if [[ "$STATUS" -ne 0 ]]; then
            echo "项目同步失败，退出码: $STATUS"
            exit "$STATUS"
          fi

      - name: Build application HAP
        shell: bash
        run: |
          set -o pipefail
          LOG_DIR="$GITHUB_WORKSPACE/.ci/integration"

          "$NODE_BIN" "$HVIGOR_WRAPPER" \
            --mode module \
            -p module=entry@default \
            -p product=default \
            --no-daemon \
            assembleHap 2>&1 | tee "$LOG_DIR/assemble-app.log"

          STATUS=${PIPESTATUS[0]}
          if [[ "$STATUS" -ne 0 ]]; then
            echo "应用 HAP 构建失败，退出码: $STATUS"
            exit "$STATUS"
          fi

      - name: Build ohosTest HAP
        shell: bash
        run: |
          set -o pipefail
          LOG_DIR="$GITHUB_WORKSPACE/.ci/integration"

          "$NODE_BIN" "$HVIGOR_WRAPPER" \
            -p module=entry@ohosTest \
            --no-daemon \
            assembleHap 2>&1 | tee "$LOG_DIR/assemble-ohosTest.log"

          STATUS=${PIPESTATUS[0]}
          if [[ "$STATUS" -ne 0 ]]; then
            echo "ohosTest HAP 构建失败，退出码: $STATUS"
            exit "$STATUS"
          fi

      - name: Resolve HAP outputs
        shell: bash
        run: |
          set -euo pipefail
          LOG_DIR="$GITHUB_WORKSPACE/.ci/integration"

          APP_HAP="$GITHUB_WORKSPACE/entry/build/default/outputs/default/entry-default-signed.hap"
          TEST_HAP="$GITHUB_WORKSPACE/entry/build/default/outputs/ohosTest/entry-ohosTest-signed.hap"

          if [[ ! -f "$APP_HAP" ]] || [[ ! -f "$TEST_HAP" ]]; then
            echo "预期路径 HAP 不存在，执行 find 兜底..."
            find "$GITHUB_WORKSPACE/entry/build" -type f -name '*.hap' | tee "$LOG_DIR/hap-files.log"
            [[ ! -f "$APP_HAP" ]] && echo "未找到 app HAP: $APP_HAP"
            [[ ! -f "$TEST_HAP" ]] && echo "未找到 test HAP: $TEST_HAP"
            exit 1
          fi

          echo "APP_HAP=$APP_HAP" >> "$GITHUB_ENV"
          echo "TEST_HAP=$TEST_HAP" >> "$GITHUB_ENV"

          {
            echo "- App HAP: $APP_HAP"
            echo "- Test HAP: $TEST_HAP"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install application and test HAP
        shell: bash
        run: |
          set -euo pipefail
          LOG_DIR="$GITHUB_WORKSPACE/.ci/integration"

          # 只在主 app 未安装时才安装（避免覆盖开发者通过 IDE 安装的版本）
          if "$HDC_BIN" -t "$DEVICE_SERIAL" shell "bm dump -n $BUNDLE_NAME 2>/dev/null" \
              | grep -q "bundle name"; then
            echo "主 app 已安装，跳过安装主 HAP（保留开发者版本）"
          else
            echo "主 app 未安装，执行首次安装..."
            "$HDC_BIN" -t "$DEVICE_SERIAL" install -r "$APP_HAP" 2>&1 | tee "$LOG_DIR/install-app.log"
          fi
          "$HDC_BIN" -t "$DEVICE_SERIAL" install -r "$TEST_HAP" 2>&1 | tee "$LOG_DIR/install-test.log"
          # 等待 hdc install 的后台 hidumper 采集完成，避免干扰后续 hilog 流
          sleep 5

      - name: Run device integration tests
        shell: bash
        env:
          WEBDAV_HOST: ${{ secrets.WEBDAV_HOST }}
          WEBDAV_USERNAME: ${{ secrets.WEBDAV_USERNAME }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
          WEBDAV_PATH: ${{ secrets.WEBDAV_PATH }}
        run: |
          set -o pipefail
          LOG_DIR="$GITHUB_WORKSPACE/.ci/integration"
          TEST_CMD="aa test -b $BUNDLE_NAME -m $TEST_MODULE -s unittest OpenHarmonyTestRunner"
          TEST_CMD="$TEST_CMD -s WEBDAV_HOST '${WEBDAV_HOST:-}'"
          TEST_CMD="$TEST_CMD -s WEBDAV_USERNAME '${WEBDAV_USERNAME:-}'"
          TEST_CMD="$TEST_CMD -s WEBDAV_PASSWORD '${WEBDAV_PASSWORD:-}'"
          TEST_CMD="$TEST_CMD -s WEBDAV_PATH '${WEBDAV_PATH:-/dav}'"
          # UI 测试默认禁用（CI 无连接设备；有设备时可设 ENABLE_UI_TESTS=true）
          # native 层 OpenSSL 竞态已于 PR #169 修复，设备环境下可正常运行 29/30 用例
          TEST_CMD="$TEST_CMD -s ENABLE_UI_TESTS false"
          # HTTPS / SMB / 扫描 / 播放器测试在无对应环境时跳过
          TEST_CMD="$TEST_CMD -s SKIP_HTTPS_TESTS true"
          TEST_CMD="$TEST_CMD -s SKIP_SMB_TESTS true"
          TEST_CMD="$TEST_CMD -s SKIP_SCAN_TESTS true"
          TEST_CMD="$TEST_CMD -s SKIP_PLAYER_TESTS true"

          # 验证设备连接是否仍然有效（hdc install 后 hidumper 可能导致连接失效）
          echo "验证设备连接: $DEVICE_SERIAL"
          if ! "$HDC_BIN" -t "$DEVICE_SERIAL" shell "echo __hdc_ok__" 2>/dev/null | grep -q "__hdc_ok__"; then
            echo "设备连接失效，重启 hdc 守护进程..."
            "$HDC_BIN" kill || true
            sleep 3
            "$HDC_BIN" start || true
            sleep 3
            # 重建后重新探测真实设备串号（过滤 hdc 占位行 [Empty]）
            NEW_SERIAL=$("$HDC_BIN" list targets | grep -v '^\[' | awk 'NF {print $1}' | head -n 1)
            if [[ -n "$NEW_SERIAL" ]]; then
              echo "重新检测到设备: $NEW_SERIAL（原 DEVICE_SERIAL=$DEVICE_SERIAL）"
              DEVICE_SERIAL="$NEW_SERIAL"
            fi
            if ! "$HDC_BIN" -t "$DEVICE_SERIAL" shell "echo __hdc_ok__" 2>/dev/null | grep -q "__hdc_ok__"; then
              echo "重连失败，当前可用设备："
              "$HDC_BIN" list targets
              exit 1
            fi
            echo "设备重连成功: $DEVICE_SERIAL"
          fi

          # hilog 采集在安装完成、hidumper 噪音消散之后再启动，确保采集到 aa test 的完整日志
          "$HDC_BIN" -t "$DEVICE_SERIAL" shell "hilog -b ${{ inputs.logLevel }}" || true
          "$HDC_BIN" -t "$DEVICE_SERIAL" shell "hilog -r" || true
          nohup "$HDC_BIN" -t "$DEVICE_SERIAL" shell "hilog" > "$LOG_DIR/device.hilog" 2>&1 &
          HILOG_PID=$!
          sleep 2

          echo "执行命令: aa test -b $BUNDLE_NAME -m $TEST_MODULE -s unittest OpenHarmonyTestRunner [+env params]" | tee "$LOG_DIR/test-command.log"
          "$HDC_BIN" -t "$DEVICE_SERIAL" shell "$TEST_CMD" 2>&1 | tee "$LOG_DIR/aa-test.log" || true

          # 等待崩溃日志写入缓冲区后再停止 hilog
          sleep 3
          kill "$HILOG_PID" >/dev/null 2>&1 || true

          if grep -q 'TestFinished-ResultCode: 0' "$LOG_DIR/aa-test.log"; then
            echo "## 集成测试结果" >> "$GITHUB_STEP_SUMMARY"
            echo "- ✅ 集成测试通过，ResultCode=0" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## 集成测试结果" >> "$GITHUB_STEP_SUMMARY"
            echo "- ❌ 集成测试失败，TestFinished-ResultCode 非 0" >> "$GITHUB_STEP_SUMMARY"
            echo '### 最近设备日志（末 100 行）' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -100 "$LOG_DIR/device.hilog" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Generate Allure Results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          LOG_DIR="$GITHUB_WORKSPACE/.ci/integration"
          ALLURE_RESULTS="$GITHUB_WORKSPACE/.ci/allure-results"
          mkdir -p "$ALLURE_RESULTS"

          python3 - <<'PY'
          import json, os, re, uuid
          from pathlib import Path
          from datetime import datetime, timezone

          log_dir = Path(os.environ['GITHUB_WORKSPACE']) / '.ci' / 'integration'
          results_dir = Path(os.environ['GITHUB_WORKSPACE']) / '.ci' / 'allure-results'
          results_dir.mkdir(parents=True, exist_ok=True)

          aa_log = log_dir / 'aa-test.log'
          log_text = aa_log.read_text(encoding='utf-8', errors='replace') if aa_log.exists() else ''

          now_ms = int(datetime.now(timezone.utc).timestamp() * 1000)

          labels = [
            {'name': 'suite',        'value': 'Integration Tests'},
            {'name': 'parentSuite',  'value': 'Device Tests'},
            {'name': 'tag',          'value': 'integration'},
          ]

          # Parse hypium / OpenHarmonyTestRunner output
          # Pattern 1: "[pass] testCaseName" / "[fail] testCaseName" (hypium text, may have prefix)
          # Pattern 2: OHOS_REPORT_STATUS: test=xxx + OHOS_REPORT_STATUS_CODE: 0/-2
          cases = []

          # Pattern 1: [pass]/[fail] lines; use re.search to handle prefixes like "[Hypium] "
          for line in log_text.splitlines():
            m_pass = re.search(r'\[pass\]\s+(\S+)', line)
            m_fail = re.search(r'\[fail\]\s+(\S+)', line)
            if m_pass:
              cases.append({'name': m_pass.group(1), 'status': 'passed', 'message': ''})
            elif m_fail:
              msg = line[m_fail.end():].strip()
              cases.append({'name': m_fail.group(1), 'status': 'failed', 'message': msg})

          # Pattern 2: OHOS_REPORT style (OpenHarmonyTestRunner per-test result)
          # OHOS_REPORT_STATUS_CODE: 1 = test started (skip), 0 = passed, -2 = failed
          if not cases:
            test_name = None
            for line in log_text.splitlines():
              m = re.match(r'OHOS_REPORT_STATUS:\s+test=(.+)', line)
              if m:
                test_name = m.group(1).strip()
              rc = re.match(r'OHOS_REPORT_STATUS_CODE:\s+(-?\d+)', line)
              if rc and test_name:
                code = int(rc.group(1))
                if code != 1:  # 1 = started event, not a final result
                  status = 'passed' if code == 0 else 'failed'
                  cases.append({'name': test_name, 'status': status, 'message': ''})
                  test_name = None

          # Fallback: one summary result based on overall ResultCode
          if not cases:
            overall_pass = 'TestFinished-ResultCode: 0' in log_text
            status = 'passed' if overall_pass else 'failed'
            msg = '' if overall_pass else (
              next((l for l in log_text.splitlines() if 'TestFinished-ResultMsg' in l), 'Unknown failure')
            )
            cases.append({'name': 'IntegrationTestSuite', 'status': status, 'message': msg})

          for i, case in enumerate(cases):
            result_uuid = str(uuid.uuid4())
            result = {
              'uuid': result_uuid,
              'historyId': str(uuid.uuid5(uuid.NAMESPACE_DNS, case['name'])),
              'name': case['name'],
              'status': case['status'],
              'start': now_ms + i,
              'stop': now_ms + i + 1,
              'labels': labels,
            }
            if case['status'] == 'failed' and case['message']:
              result['statusDetails'] = {'message': case['message']}
            (results_dir / f'{result_uuid}-result.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8'
            )

          print(f"Generated {len(cases)} Allure result(s) in {results_dir}")
          PY

          # environment.properties
          cat > "$ALLURE_RESULTS/environment.properties" <<EOF
          BUNDLE_NAME=${BUNDLE_NAME}
          TEST_MODULE=${TEST_MODULE}
          DEVICE_SERIAL=${DEVICE_SERIAL:-unknown}
          BRANCH=${GITHUB_REF_NAME}
          SHA=${GITHUB_SHA}
          EOF

          # executor.json
          python3 -c "
          import json, os
          data = {
            'name': 'GitHub Actions',
            'type': 'github',
            'buildName': 'Run #' + os.environ.get('GITHUB_RUN_NUMBER', ''),
            'buildUrl': 'https://github.com/' + os.environ.get('GITHUB_REPOSITORY', '') + '/actions/runs/' + os.environ.get('GITHUB_RUN_ID', ''),
            'reportName': 'VidAll TV Integration Tests Allure Report',
          }
          print(json.dumps(data, ensure_ascii=False, indent=2))
          " > "$ALLURE_RESULTS/executor.json"

      - name: Load Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure Report
        if: always()
        shell: bash
        env:
          ALLURE_VERSION: "3.6.0"
        run: |
          set -euo pipefail
          ALLURE_RESULTS="$GITHUB_WORKSPACE/.ci/allure-results"
          ALLURE_REPORT="$GITHUB_WORKSPACE/allure-history"

          # 复制历史趋势数据（Allure 3 格式：需包含 history-trend.json）
          if [[ -d "$GITHUB_WORKSPACE/gh-pages/integration/history" ]] && \
             [[ -f "$GITHUB_WORKSPACE/gh-pages/integration/history/history-trend.json" ]]; then
            mkdir -p "$ALLURE_RESULTS/history"
            cp -R "$GITHUB_WORKSPACE/gh-pages/integration/history/." "$ALLURE_RESULTS/history/"
            echo "Restored Allure 3 history from gh-pages/integration/history"
          else
            echo "未找到 Allure 3 兼容 history，从本次开始建立新趋势图"
            rm -rf "$ALLURE_RESULTS/history"
          fi

          # Allure 3 基于 Node.js，无需 Java
          NPX_BIN="$(dirname "$NODE_BIN")/npx"
          echo "生成 Allure 3 HTML 报告（allure@${ALLURE_VERSION}）..."
          "$NPX_BIN" --yes "allure@${ALLURE_VERSION}" generate "$ALLURE_RESULTS" --output "$ALLURE_REPORT"
          echo "Report generated at $ALLURE_REPORT"

      - name: Publish integration report to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          destination_dir: integration
          keep_files: true

      - name: Update integration-status.json and portal
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ALLURE_REPORT="$GITHUB_WORKSPACE/allure-history"
          REPORTS_BRANCH="gh-pages"
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          SITE_DIR="$GITHUB_WORKSPACE/pages-site-portal"

          rm -rf "$SITE_DIR"
          if git clone --depth 1 --branch "$REPORTS_BRANCH" "$REPO_URL" "$SITE_DIR" 2>/dev/null; then
            echo "Re-cloned gh-pages for portal update"
          else
            mkdir -p "$SITE_DIR"
            cd "$SITE_DIR" && git init && git checkout -b "$REPORTS_BRANCH"
          fi

          export ALLURE_REPORT_DIR_ENV="$ALLURE_REPORT"
          export PAGES_SITE_DIR="$SITE_DIR"
          export CURRENT_RUN_NUMBER="${GITHUB_RUN_NUMBER}"
          export GITHUB_RUN_URL_ENV="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # 将当前集成测试报告归档到 integration/runs/run-N/（用于历史追溯）
          INTG_SRC="$SITE_DIR/integration"
          INTG_RUN_DIR="$SITE_DIR/integration/runs/run-${GITHUB_RUN_NUMBER}"
          if [ -d "$INTG_SRC" ]; then
            mkdir -p "$INTG_RUN_DIR"
            # 复制所有内容，但排除 runs/ 子目录（避免嵌套膨胀）
            rsync -a --exclude='runs/' "$INTG_SRC/" "$INTG_RUN_DIR/"
            echo "已将集成报告归档至 $INTG_RUN_DIR"
          fi

          # 清理旧的集成 runs，保留最近 10 次
          if [ -d "$SITE_DIR/integration/runs" ]; then
            INTG_KEEP=10
            INTG_TOTAL=$(ls -1d "$SITE_DIR/integration/runs/run-"* 2>/dev/null | wc -l | tr -d ' ')
            if [ "$INTG_TOTAL" -gt "$INTG_KEEP" ]; then
              INTG_DEL=$((INTG_TOTAL - INTG_KEEP))
              echo "清理集成测试最旧的 $INTG_DEL 个 runs（共 $INTG_TOTAL 个，保留 $INTG_KEEP 个）"
              ls -1d "$SITE_DIR/integration/runs/run-"* 2>/dev/null | sort -t- -k2 -n | head -n "$INTG_DEL" | xargs rm -rf
            fi
          fi

          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          site = Path(os.environ['PAGES_SITE_DIR'])
          current_run_number = os.environ['CURRENT_RUN_NUMBER']
          allure_report_dir = Path(os.environ['ALLURE_REPORT_DIR_ENV'])
          run_url = os.environ['GITHUB_RUN_URL_ENV']

          # ── integration-status.json ───────────────────────────────────────
          # 直接从 allure-results *-result.json 计数（兼容 Allure 2/3，无需 widgets/summary.json）
          passed, failed, total = 0, 0, 0
          allure_results_dir = Path(os.environ['GITHUB_WORKSPACE']) / '.ci' / 'allure-results'
          for result_file in allure_results_dir.glob('*-result.json'):
            try:
              data = json.loads(result_file.read_text(encoding='utf-8'))
              status = data.get('status', '')
              total += 1
              if status == 'passed':
                passed += 1
              elif status in ('failed', 'broken'):
                failed += 1
            except Exception:
              pass
          # 兜底：如果 allure-results 目录不存在或为空，尝试旧的 widgets/summary.json（Allure 2）
          if total == 0:
            summary_path = allure_report_dir / 'widgets' / 'summary.json'
            if summary_path.exists():
              try:
                summary = json.loads(summary_path.read_text(encoding='utf-8'))
                stat = summary.get('statistic', {})
                passed = int(stat.get('passed', 0))
                failed = int(stat.get('failed', 0)) + int(stat.get('broken', 0))
                total  = int(stat.get('total', 0))
              except Exception:
                pass
          print(f'统计结果: passed={passed}, failed={failed}, total={total}')

          if failed == 0 and total > 0:
            suite_status = 'passed'
          elif failed > 0 and passed > 0:
            suite_status = 'partial'
          elif total == 0:
            suite_status = 'passed'
          else:
            suite_status = 'failed'

          intg_status_data = {
            'suite': 'integration',
            'status': suite_status,
            'passed': passed,
            'failed': failed,
            'total': total,
            'run_number': current_run_number,
            'run_url': run_url,
            'timestamp': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
          }
          (site / 'integration-status.json').write_text(
            json.dumps(intg_status_data, ensure_ascii=False, indent=2), encoding='utf-8'
          )

          # ── 更新 integration-history.json ─────────────────────────────────
          intg_hist_path = site / 'integration' / 'integration-history.json'
          try:
              intg_hist = json.loads(intg_hist_path.read_text(encoding='utf-8')) if intg_hist_path.exists() else []
          except Exception:
              intg_hist = []
          intg_hist.append({
              'run_number': current_run_number,
              'timestamp':  intg_status_data['timestamp'],
              'status':     'pass' if suite_status == 'passed' else 'fail',
              'passed':     passed,
              'failed':     failed,
              'total':      total,
              'report_href': f'integration/runs/run-{current_run_number}/index.html',
          })
          intg_hist = intg_hist[-30:]
          intg_hist_path.parent.mkdir(parents=True, exist_ok=True)
          intg_hist_path.write_text(json.dumps(intg_hist, ensure_ascii=False, indent=2), encoding='utf-8')
          print(f'integration-history.json 已更新（{len(intg_hist)} 条）')

          # ── portal index.html ─────────────────────────────────────────────
          def load_status(json_path):
            if json_path.exists():
              try:
                return json.loads(json_path.read_text(encoding='utf-8'))
              except Exception:
                pass
            return None

          def status_badge(s):
            if s is None:
              return '🔄', '#8b949e', '尚未运行'
            st = s.get('status', 'unknown')
            if st == 'passed':
              return '✅', '#3fb950', '全部通过'
            elif st == 'partial':
              return '⚠️', '#d29922', '部分失败'
            else:
              return '❌', '#f85149', '存在失败'

          def render_card(title, s, report_href, archive_href, coverage_href=None):
            icon, color, label = status_badge(s)
            if s:
              p, f, t = s.get('passed', 0), s.get('failed', 0), s.get('total', 0)
              rate = f'{p} / {t}'
              run_info = f'Run #{s.get("run_number", "-")} &nbsp;·&nbsp; {s.get("timestamp", "-")[:10]}'
            else:
              rate = '—'
              run_info = '暂无记录'
            cov_btn = (f'      <a href="{coverage_href}" style="background:#21262d;color:#8b949e;border:1px solid #30363d;border-radius:6px;padding:7px 16px;font-size:0.9rem;text-decoration:none;">覆盖率报告</a>'
                       if coverage_href else '')
            return '\n'.join(filter(None, [
              '  <div style="background:#161b22;border:1px solid #30363d;border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:12px;">',
              f'    <div style="font-size:1.1rem;font-weight:600;color:#e6edf3;">{title}</div>',
              f'    <div style="font-size:2rem;">{icon} <span style="font-size:1rem;color:{color};font-weight:500;">{label}</span></div>',
              f'    <div style="font-size:1.5rem;font-weight:700;color:#e6edf3;">{rate} <span style="font-size:0.85rem;color:#8b949e;font-weight:400;">用例通过</span></div>',
              f'    <div style="font-size:0.85rem;color:#8b949e;">{run_info}</div>',
              '    <div style="display:flex;gap:10px;margin-top:4px;flex-wrap:wrap;">',
              f'      <a href="{report_href}" style="background:#238636;color:#fff;border-radius:6px;padding:7px 16px;font-size:0.9rem;text-decoration:none;font-weight:500;">查看报告</a>',
              f'      <a href="{archive_href}" style="background:#21262d;color:#58a6ff;border:1px solid #30363d;border-radius:6px;padding:7px 16px;font-size:0.9rem;text-decoration:none;">历史记录</a>',
              cov_btn,
              '    </div>',
              '  </div>',
            ]))

          unit_st = load_status(site / 'unit-status.json')
          intg_st = load_status(site / 'integration-status.json')

          unit_run_num  = unit_st.get('run_number', '') if unit_st else ''
          intg_run_num  = intg_st.get('run_number', '') if intg_st else ''
          unit_report_href = f'unit/runs/run-{unit_run_num}/index.html?v={unit_run_num}' if unit_run_num else 'unit/index.html'
          unit_coverage_href = f'unit/runs/run-{unit_run_num}/coverage/index.html?v={unit_run_num}' if unit_run_num else None
          intg_report_href = f'integration/runs/run-{intg_run_num}/index.html' if intg_run_num else 'integration/index.html'

          unit_card = render_card(
            '单元测试', unit_st,
            report_href=unit_report_href,
            archive_href='unit/history-list/index.html',
            coverage_href=unit_coverage_href,
          )
          intg_card = render_card(
            '集成测试', intg_st,
            report_href=intg_report_href,
            archive_href='integration/history-list/index.html',
          )

          portal_html = '\n'.join([
            '<!DOCTYPE html>',
            '<html lang="zh-CN">',
            '<head>',
            '  <meta charset="UTF-8" />',
            '  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />',
            '  <meta http-equiv="Pragma" content="no-cache" />',
            '  <meta http-equiv="Expires" content="0" />',
            '  <meta name="viewport" content="width=device-width, initial-scale=1" />',
            '  <title>VidAll TV · 测试报告总览</title>',
            '  <script src="https://cdn.tailwindcss.com"></script>',
            '</head>',
            '<body style="margin:0;background:#0d1117;color:#e6edf3;font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;">',
            '  <div style="max-width:860px;margin:0 auto;padding:40px 20px;">',
            '    <div style="margin-bottom:32px;">',
            '      <h1 style="margin:0 0 6px;font-size:1.6rem;font-weight:700;color:#e6edf3;">VidAll TV 测试报告</h1>',
            '      <p style="margin:0;color:#8b949e;font-size:0.9rem;">单元测试 · 集成测试 · 统一入口</p>',
            '    </div>',
            '    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;">',
            unit_card,
            intg_card,
            '    </div>',
            '  </div>',
            '</body>',
            '</html>',
          ])
          (site / 'index.html').write_text(portal_html, encoding='utf-8')
          (site / '404.html').write_text(portal_html, encoding='utf-8')

          # ── _headers：告知 EdgeOne/CDN 不缓存任何页面 ──────────────────────
          # 注意：Allure 的 app.js/app.css 没有 content hash，无法安全设置 immutable
          # Netlify/EdgeOne 的 * 不跨路径分隔符，/unit/* 无法覆盖 unit/data/*.json 等子目录
          # 使用 /* 全局兜底，覆盖所有路径（包括 Allure data/ test-cases/ 等嵌套子目录）
          headers_content = '\n'.join([
            '# EdgeOne Pages / Netlify 兼容的 HTTP 响应头配置',
            '# 所有页面不缓存（Allure 静态资源无 content hash，Portal/JSON 随 CI 变化）',
            '/*',
            '  Cache-Control: no-cache, no-store, must-revalidate',
            '  Pragma: no-cache',
          ])
          (site / '_headers').write_text(headers_content + '\n', encoding='utf-8')

          # ── 生成 integration/history-list/index.html（TailwindCSS 深色风格）──
          intg_hl_dir = site / 'integration' / 'history-list'
          intg_hl_dir.mkdir(parents=True, exist_ok=True)
          intg_hist_for_page = list(reversed(intg_hist))
          intg_rows = ''
          for h in intg_hist_for_page:
              rn   = h.get('run_number', '-')
              ts   = h.get('timestamp', '')[:19].replace('T', ' ')
              st   = h.get('status', 'fail')
              pa   = h.get('passed', 0)
              fa   = h.get('failed', 0)
              tot  = h.get('total', 0)
              href = h.get('report_href', '#')
              badge = ('<span class="px-2 py-0.5 rounded text-xs font-semibold bg-green-900 text-green-300">通过</span>'
                       if st == 'pass' else
                       '<span class="px-2 py-0.5 rounded text-xs font-semibold bg-red-900 text-red-300">失败</span>')
              intg_rows += (
                  '<tr class="border-b border-gray-800 hover:bg-gray-800/50 transition-colors">'
                  f'<td class="py-3 px-4 text-gray-300 font-mono">#{rn}</td>'
                  f'<td class="py-3 px-4 text-gray-400 text-sm">{ts}</td>'
                  f'<td class="py-3 px-4">{badge}</td>'
                  f'<td class="py-3 px-4 text-gray-300 text-sm">{pa}/{tot}'
                  + (f' <span class="text-red-400">({fa}失败)</span>' if fa else '') + '</td>'
                  f'<td class="py-3 px-4"><a href="../../{href}" class="text-blue-400 hover:underline text-sm">查看报告</a></td>'
                  '</tr>'
              )
          if not intg_rows:
              intg_rows = '<tr><td colspan="5" class="py-8 text-center text-gray-500">暂无历史记录</td></tr>'
          intg_hl_html = (
              '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n'
              '  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1">\n'
              '  <title>集成测试历史记录</title>\n'
              '  <script src="https://cdn.tailwindcss.com/3.4.17"></script>\n'
              '</head>\n<body class="bg-gray-950 text-gray-200 min-h-screen font-sans">\n'
              '  <div class="max-w-5xl mx-auto px-4 py-10">\n'
              '    <div class="mb-8">\n'
              '      <a href="../../index.html" class="text-blue-400 text-sm hover:underline">← 报告首页</a>\n'
              '      <h1 class="mt-3 text-2xl font-bold text-gray-100">集成测试历史记录</h1>\n'
              f'      <p class="mt-1 text-gray-400 text-sm">最近 {len(intg_hist_for_page)} 次运行</p>\n'
              '    </div>\n'
              '    <div class="bg-gray-900 rounded-xl overflow-hidden border border-gray-800">\n'
              '      <table class="w-full text-left">\n        <thead>\n'
              '          <tr class="border-b border-gray-800 bg-gray-900">\n'
              '            <th class="py-3 px-4 text-gray-400 font-medium text-sm">Run</th>\n'
              '            <th class="py-3 px-4 text-gray-400 font-medium text-sm">时间</th>\n'
              '            <th class="py-3 px-4 text-gray-400 font-medium text-sm">状态</th>\n'
              '            <th class="py-3 px-4 text-gray-400 font-medium text-sm">通过 / 总计</th>\n'
              '            <th class="py-3 px-4 text-gray-400 font-medium text-sm">报告</th>\n'
              '          </tr>\n        </thead>\n'
              f'        <tbody>{intg_rows}</tbody>\n'
              '      </table>\n    </div>\n  </div>\n</body></html>'
          )
          (intg_hl_dir / 'index.html').write_text(intg_hl_html, encoding='utf-8')
          print(f'integration/history-list/index.html 已生成（{len(intg_hist_for_page)} 条）')
          PY

          # 确保 vendor 文件存在
          mkdir -p "$SITE_DIR/vendor"
          if [ ! -s "$SITE_DIR/vendor/tailwind.js" ]; then
            curl -fsSL "https://cdn.tailwindcss.com/3.4.17" -o "$SITE_DIR/vendor/tailwind.js" || \
            curl -fsSL "https://cdn.bootcdn.net/ajax/libs/tailwindcss/3.4.1/tailwind.min.js" -o "$SITE_DIR/vendor/tailwind.js"
          fi
          if [ ! -s "$SITE_DIR/vendor/echarts.min.js" ]; then
            curl -fsSL "https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js" -o "$SITE_DIR/vendor/echarts.min.js" || \
            curl -fsSL "https://cdn.bootcdn.net/ajax/libs/echarts/5.6.0/echarts.min.js" -o "$SITE_DIR/vendor/echarts.min.js"
          fi

          cd "$SITE_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration-status.json integration/integration-history.json integration/history-list/index.html integration/runs/ index.html 404.html _headers vendor/ || true
          git commit -m "更新: 集成测试报告状态 #${GITHUB_RUN_NUMBER}" || echo "No portal changes to commit"
          git push "$REPO_URL" HEAD:"$REPORTS_BRANCH" || echo "Portal push skipped"
          rm -rf "$SITE_DIR/.git"

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-artifacts
          path: |
            ${{ github.workspace }}/.ci/integration
            ${{ github.workspace }}/.ci/allure-results
          if-no-files-found: warn

      - name: Cleanup peaceiris/actions-gh-pages temp dirs
        if: always()
        shell: bash
        run: |
          # peaceiris/actions-gh-pages@v3 在 self-hosted runner 的 $HOME 下
          # 遗留 actions_github_pages_<run_id> 临时目录，需手动清理
          find "$HOME" -maxdepth 1 -type d -name "actions_github_pages_*" -exec rm -rf {} + 2>/dev/null || true
          echo "Cleaned up actions_github_pages_* temp dirs"
